# Test configuration of the ctx_discord_policy suites (development only; Hermes never reads it). The plugin
# has no pyproject.toml on purpose: Hermes reads a plugin's pyproject.toml when it installs or enables the
# plugin, asks about any dependency declared there (extras included) and adds the plugin to its own uv
# workspace. The test dependencies are pinned in .github/workflows/hermes-ctx-discord-policy.yml.
[pytest]
pythonpath = . tests
testpaths = tests
addopts = --import-mode=importlib -p no:cacheprovider
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    contract: runs against a Hermes source checkout (HERMES_SRC); skipped without it
    replay: replays Discord interactions through discord.py; skipped without discord.py
