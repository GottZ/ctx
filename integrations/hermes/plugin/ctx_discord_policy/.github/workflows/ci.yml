# Unit/replay/docs tests on the supported Python range, the private-value scan, and contract tests against
# real Hermes source (oldest supported release, latest release, upstream main). The private-value scan
# needs the repository secret DSP_PRIVATE_SCAN_KEY; without it (forks) the docs job fails closed.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Pull requests share a group per ref (superseded runs are cancelled); every push to main gets its own
  # group (keyed by commit), so no push run is ever cancelled or dropped from the queue.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit:
    name: unit py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 PyYAML==6.0.3 discord.py==2.7.1

      # Contract tests skip themselves here (no HERMES_SRC); they run in the contract job.
      # DSP_REQUIRE_DISCORD turns a missing discord.py into an error instead of skipped replay tests.
      - name: Unit, replay and docs tests
        env:
          DSP_REQUIRE_DISCORD: "1"
        run: python -m pytest -q -rfEs

  docs:
    name: docs and private-value scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      # Keyed digests: without the secret the scanner exits 2 (never a silent pass).
      # Tree, every earlier file version and commit message reachable from HEAD, and the PR title/body.
      - name: Private-value scan (keyed patterns)
        env:
          DSP_PRIVATE_SCAN_KEY: ${{ secrets.DSP_PRIVATE_SCAN_KEY }}
          PR_TEXT: "${{ github.event.pull_request.title }}\n${{ github.event.pull_request.body }}"
        run: python ci/private_scan.py --text-env PR_TEXT

  contract:
    name: contract hermes@${{ matrix.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Upstream main moves under us: its result is reported but does not block landing a change.
    continue-on-error: ${{ matrix.ref == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        ref: [v0.22.4, v0.23.0, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Hermes at ${{ matrix.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: hermes
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.5"

      - name: Hermes environment (locked dependencies + discord extra)
        working-directory: hermes
        run: |
          uv sync --frozen --no-install-project --extra discord
          uv pip install --python .venv/bin/python pytest==9.1.1 pytest-asyncio==1.4.0
          echo "HERMES_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Contract tests
        env:
          HERMES_SRC: ${{ github.workspace }}/hermes
          HERMES_REF: ${{ matrix.ref }}
          CONTRACT_OUT: ${{ github.workspace }}/contract-out
          DSP_CONTRACT_REQUIRED: "1"
        run: |
          echo "Hermes ${HERMES_REF} @ ${HERMES_SHA}"
          hermes/.venv/bin/python -m pytest -q -rfEs tests/contract

      - name: Upload contract reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: contract-${{ matrix.ref }}
          path: contract-out/
          retention-days: 14
          if-no-files-found: warn
