# golangci-lint v2 Konfiguration für ctx
# github.com/GottZ/ctx — GottZ 4-Way RRF | GottZ Scope Model | GottZ Guard
#
# Philosophie: Fehler finden, die Go vet nicht findet — keine Style-Polizei.
# Linter-Auswahl: sicherheitskritisch (errcheck, gosec) + Qualität (gocritic)
# + Korrektheit (staticcheck). Ausdrücklich KEIN gofmt/goimports-Zwang im CI
# (das macht der IDE-Save, nicht der CI-Block).

version: "2"

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - gosec
    - govet
    - ineffassign
    - cyclop
    - nilerr
    - errorlint
    - godot
    - depguard

  settings:
    cyclop:
      max-complexity: 25

    # F1 layering rule (design/01-config-core.md §2.1): internal/config is
    # consumed ONLY by cmd/**, internal/handler and internal/events. Domain
    # packages (llm, embed, dream, rrf, rerank, …) stay parameter-pure — they
    # receive backends.Backend tuples and plain values as arguments. This
    # kills config import cycles by design and keeps domain packages trivially
    # testable. Globs match absolute paths; the negations carve out the
    # allowed consumers (and the package itself, for its tests).
    depguard:
      rules:
        config-layering:
          files:
            - "!**/go/cmd/**"
            - "!**/go/internal/handler/**"
            - "!**/go/internal/events/**"
            - "!**/go/internal/config/**"
          deny:
            - pkg: "github.com/GottZ/ctx/internal/config"
              desc: "internal/config may only be imported by cmd/**, internal/handler, internal/events (F1 layering rule — pass values as parameters instead)"

    gosec:
      excludes:
        - G115
        - G304
        - G118
        - G706

    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*net/http.Response).Body.Close

    godot:
      scope: toplevel
      period: true

  exclusions:
    rules:
      - path: "_test\\.go$"
        linters:
          - gosec
          - errcheck
          - cyclop
      - path: "testutil/"
        linters:
          - gosec

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
