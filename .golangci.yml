# golangci-lint v2 Konfiguration für ctx
# github.com/GottZ/ctx — GottZ 4-Way RRF | GottZ Scope Model | GottZ Guard
#
# Philosophie: Fehler finden, die Go vet nicht findet — keine Style-Polizei.
# Linter-Auswahl: sicherheitskritisch (errcheck, gosec) + Qualität (gocritic)
# + Korrektheit (staticcheck). Ausdrücklich KEIN gofmt/goimports-Zwang im CI
# (das macht der IDE-Save, nicht der CI-Block).

version: "2"

# NZ-1 (Nachlauf-Board N3): ohne build-tags ist jede Datei mit
# `//go:build integration` für golangci-lint unsichtbar — 415 Testdateien, in
# denen 111 Funde lagen, darunter drei depguard-Verstöße gegen genau die Regeln
# unten (gemessen 06.09.: 3 depguard, 1 errorlint, 3 staticcheck, 104 godot; die
# Voreinstellung `max-same-issues: 10` zeigte davon nur 17). Der getaggte Lauf
# ist eine OBERMENGE des tag-losen: der Baum trägt keine einzige
# `!integration`-Bedingung (gemessen: 415× `integration`, 0× `!integration`),
# diese Zeile verliert also keine Datei, sie nimmt die getaggten dazu. Der Tag
# steht deshalb hier und nicht als zweiter Aufruf in CI-Job und pre-commit-Hook:
# ein zweiter Lauf wäre Doppelarbeit für dieselbe Wahrheit (frischer Cache,
# gemessen: 15,4 s getaggt gegenüber 12,5 s tag-los), und zwei Aufrufe können
# auseinanderlaufen — eine Konfigurationszeile, die jeder Aufrufer liest, nicht.
run:
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - gosec
    - govet
    - ineffassign
    - cyclop
    - nilerr
    - errorlint
    - godot
    - depguard
    - forbidigo
    - unused

  settings:
    cyclop:
      max-complexity: 25

    # MT 06-C5 / 03-W4 fail-open guard: a tenant-less config Snapshot() on a
    # REQUEST path silently serves the _global generation instead of the
    # tenant-resolved one — a cross-tenant config leak that compiles and passes
    # every test. There is no type-system signal for "this call should have been
    # SnapshotForRequest(ctx)", so the gate is a lint rule. analyze-types keys the
    # pattern on the RECEIVER TYPE, so it fires on config.Store / the handler-side
    # ConfigStore interface and NOT on backends.Pool.Snapshot() (a different
    # receiver) — empirically verified at build time. The $ anchor on .Snapshot
    # excludes SnapshotForRequest / SnapshotForTenant / SeedSnapshotForTest. Every
    # legitimate tenant-less site (server-global telemetry, the settings API
    # owner, the deliberately-gated audit/classify status, background retention)
    # carries an inline //nolint:forbidigo annotation naming its class
    # (BLIND/OWNER/gated/background). A NEW unannotated Snapshot() on a request
    # path fails the lint: classify it → SnapshotForRequest(ctx), or, if it is
    # genuinely tenant-less, annotate it like the rest. _test.go is excluded
    # below (test stores call Snapshot freely).
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^(.*config\.Store|.*ConfigStore)\.Snapshot$'
          msg: >-
            tenant-less config Snapshot() — a request path must call
            SnapshotForRequest(ctx) (fail-open cross-tenant config leak, MT
            06-C5/03-W4). If this site is genuinely tenant-less (server-global
            telemetry, settings-API owner, gated audit/classify, background
            retention) annotate it: //nolint:forbidigo // MT 06 BLIND/OWNER/gated/background: <reason>.

        # T04-4 Rest-Schutz: eine handgebaute Transaktions-Klammer
        # (Begin/Rollback/Commit von Hand) ist die Form, die Achse 04 nach
        # internal/pgxdb zusammengezogen hat — pgxdb.Write/WriteOpts/Read/Probe
        # sind der eine Ort dafür. Das Muster ist bewusst NICHT auf konkrete
        # Empfänger-Typen verengt: analyze-types prüft den aufgelösten Namen
        # (pgxpool.Pool.Begin, pgx.Tx.Begin, <pkg>.<NamedIface>.BeginTx), und
        # eine Verengung auf pgxpool.Pool/pgx.Conn verfehlt jedes Handle, das
        # pgxdb.Beginner einbettet (design/04-kern.md §4.4).
        #
        # Warum zwei Punkte im Muster (\.\w+\.) statt nur \.(Begin|BeginTx)$:
        # ein Feld-Schlüssel in pgxdb.Stages{Begin: "…"} löst zu <pkg>.<Feld>
        # auf — also pgxdb.Begin mit EINEM Punkt. Das rein generische Muster
        # meldet deshalb jede korrekte pgxdb.Write/Read-Aufrufstelle als
        # Verstoß (T04-4j gemessen: 38 solcher Treffer). Der zweite Punkt
        # verlangt ein Empfänger-Segment und trennt Aufruf von Feld, ohne
        # Reichweite zu kosten (T04-4j: konkrete Empfänger und benannte
        # Interface-Typen feuern unverändert). Ein LESENDER Feldzugriff auf
        # eine Stages-Variable (st.Begin) löst dagegen zu pgxdb.Stages.Begin
        # auf und würde melden — außerhalb von internal/pgxdb gibt es heute
        # keinen (T04-4j gemessen), innerhalb greift die Exklusion unten.
        #
        # Der Linter ist ein ZUSATZ-Gate, kein vollständiges: Aufrufe über ein
        # ANONYMES Interface (db interface{ pgxdb.Beginner; … }) liefern gar
        # keinen auflösbaren Namen und feuern unter KEINEM Muster — an einer
        # Wegwerf-Sonde belegt (reports/bau/T04-4j.md). Primärer Rest-Schutz
        # ist deshalb die baumweite Zählung von .Begin( / .BeginTx( über
        # internal und cmd ohne _test und ohne internal/pgxdb. Das Paket
        # internal/pgxdb selbst ist unten ausgenommen — dort stehen die echten
        # BeginTx-Aufrufe (tx.go).
        - pattern: '\.\w+\.(Begin|BeginTx)$'
          msg: >-
            handgebaute Transaktions-Klammer — pgxdb.Write/WriteOpts/Read/Probe benutzen
            (ein Ort für Begin/Rollback/Commit). Wenn diese Stelle wirklich eine
            eigene Klammer braucht, annotieren: //nolint:forbidigo // <Grund>.

    # F1 layering rule (design/01-config-core.md §2.1): internal/config is
    # consumed ONLY by cmd/**, internal/handler, internal/events and
    # internal/settings (the F2 reload owner: settings.Reload = LoadOverrides
    # → config.Build → Store.Replace, design/02-settings-store.md §2.4).
    # Domain packages (llm, embed, dream, rrf, rerank, …) stay parameter-pure
    # — they receive backends.Backend tuples and plain values as arguments.
    # This kills config import cycles by design and keeps domain packages
    # trivially testable. Globs match absolute paths; the negations carve out
    # the allowed consumers (and the package itself, for its tests).
    depguard:
      rules:
        config-layering:
          files:
            - "!**/go/cmd/**"
            - "!**/go/internal/handler/**"
            - "!**/go/internal/events/**"
            - "!**/go/internal/settings/**"
            - "!**/go/internal/config/**"
            # T04-11: a sixth consumer, and a deliberate one — the package
            # named below IS the boot sequence the cmd/** entry points used to
            # carry inline (FromEnv → Validate → report → HasErrors →
            # store.NewPool, contract G14). It is not a domain package: it
            # hands the config straight back to its caller and reads no value
            # of its own.
            - "!**/go/internal/toolboot/**"
          deny:
            - pkg: "github.com/GottZ/ctx/internal/config"
              desc: "internal/config may only be imported by cmd/**, internal/handler, internal/events, internal/settings (F1 layering rule — pass values as parameters instead)"

        # W02-02 (design/02 §4.1, L6; B15c): internal/oai is the
        # OpenAI-compatible wire surface that external model keys reach. It
        # serves models, never the knowledge corpus: a corpus package imported
        # here is one handler bug away from handing a model-key holder
        # retrieval, chat over the corpus, dream state, the event stream or
        # the block store. internal/config is already refused by
        # config-layering above — values arrive through the injected
        # func() oai.Settings getter. Tests are included: the harness has no
        # business with the corpus either. depguard checks direct imports
        # only; that the oai test binary is corpus-free transitively as well
        # (go list -deps -test ./internal/oai/ = oai, plus backends and its
        # leaves httpx, ssrfguard, pgxdb, llmusage for the W02-11 classifier
        # totality test) is kept by the tests, which use a stand-in for the
        # house Recovery instead of importing internal/handler. Deny
        # prefixes end in "$" (exact match, see the leaf rules below).
        oai-isolation:
          files:
            - "**/go/internal/oai/**"
          deny:
            - pkg: "github.com/GottZ/ctx/internal/rrf$"
              desc: "internal/oai serves models, not the corpus — retrieval (rrf) is out of reach of a model key (design/02 §4.1 L6, B15c)"
            - pkg: "github.com/GottZ/ctx/internal/chat$"
              desc: "internal/oai serves models, not the corpus — corpus chat is out of reach of a model key (design/02 §4.1 L6, B15c)"
            - pkg: "github.com/GottZ/ctx/internal/dream$"
              desc: "internal/oai serves models, not the corpus — dream state is out of reach of a model key (design/02 §4.1 L6, B15c)"
            - pkg: "github.com/GottZ/ctx/internal/events$"
              desc: "internal/oai serves models, not the corpus — the event stream is out of reach of a model key (design/02 §4.1 L6, B15c)"
            - pkg: "github.com/GottZ/ctx/internal/store$"
              desc: "internal/oai serves models, not the corpus — the block store is out of reach of a model key (design/02 §4.1 L6, B15c)"
            - pkg: "net/http/httputil$"
              desc: "internal/oai never proxies to a backend itself — every upstream call is llm.ChatRaw/ChatRawStream under llm.WalkChain (admission, overlay, egress choice, header rule; design/02 §4.1 L4, B14/B19)"
            - pkg: "crypto/tls$"
              desc: "internal/oai dials no backend — TLS to a backend lives in the httpx pool clients behind the llm wire sites (design/02 §4.1 L4, B14/B19)"

        # Leaf doctrine (design/01-schnitt.md §4.5, masterplan K7/K11 + A-4).
        # Seven packages are leaves BY DESIGN; until now the doctrine lived only
        # in their package comments, and a comment is not a gate. Every rule
        # below matches today's import graph exactly — nothing in the tree
        # changes, the NEXT violation just becomes a CI failure instead of a
        # review finding. Globs match absolute paths (same as config-layering
        # above), and a deny prefix ending in "$" is an EXACT match in depguard
        # v2 — without it "…/internal/llm" would also block "…/internal/llmlog".
        #
        # 1/7 — internal/util. The K11 wording verbatim: "sprachnahe
        # Text-Primitiven — Runen, Tokens, Wörter-Tabellen; ausschließlich
        # stdlib." The package comment (util/strings.go:1-9) states the same
        # boundary in English — the standard library and NOTHING ELSE, no
        # github.com/GottZ/ctx/… and no third-party module — which is what lets
        # any package take a primitive from here without dragging a dependency
        # along (and what let TokenSet leave internal/evalscore in T01-4). Hence
        # allow = $gostd, with the ctx half of the boundary carrying the message.
        util-leaf:
          files:
            - "**/go/internal/util/**"
          allow:
            - "$gostd"
          deny:
            - pkg: "github.com/GottZ/ctx"
              desc: "internal/util is the stdlib-only leaf of language-near text primitives — runes, tokens, word tables (K11). A helper that needs a ctx package does not belong here; it belongs next to the thing it needs (util/strings.go:4-9)"

        # 2/7 — internal/clientconfig: the ONE resolution rule for base URL and
        # API key, shared by internal/cli and cmd/ctx-armsweep (T01-6).
        # Stdlib-only on purpose (clientconfig/config.go:6-10): a tool that
        # merely needs those two values must not link the command tree, and with
        # it cobra and the whole charm stack, to get them.
        clientconfig-leaf:
          files:
            - "**/go/internal/clientconfig/**"
          allow:
            - "$gostd"
          deny:
            - pkg: "github.com/GottZ/ctx"
              desc: "internal/clientconfig is the stdlib-only leaf that resolves base URL and API key for every ctx client — importing a ctx package here drags the command tree back into the tools that only wanted those two values (T01-6, clientconfig/config.go:6-10)"

        # 3/7 — internal/visibility: THE shared "this block is visible" SQL
        # fragment (WF T6). It lives OUTSIDE internal/store because rrf cannot
        # import store (store → blocktype → rrf would cycle); store, rrf and
        # overview all embed this package directly (visibility.go:4-11).
        visibility-leaf:
          files:
            - "**/go/internal/visibility/**"
          deny:
            - pkg: "github.com/GottZ/ctx/internal/store$"
              desc: "internal/visibility is a leaf so store, rrf and overview can share ONE visibility predicate — an import of store here re-creates the cycle the package exists to break (visibility.go:4-11)"

        # 4/7 — internal/clustersql: THE shared "cluster membership, scope-pure"
        # SQL fragment, a leaf for exactly the reason visibility is one — rrf
        # cannot import store, and the filter is needed by rrf, store and
        # potentially handler (clustersql.go:4-9).
        clustersql-leaf:
          files:
            - "**/go/internal/clustersql/**"
          deny:
            - pkg: "github.com/GottZ/ctx/internal/store$"
              desc: "internal/clustersql is a leaf so rrf, store and handler can share ONE cluster-membership fragment — an import of store here re-creates the cycle the package exists to break (clustersql.go:4-9)"
            - pkg: "github.com/GottZ/ctx/internal/rrf$"
              desc: "internal/clustersql is a leaf so rrf, store and handler can share ONE cluster-membership fragment — rrf imports clustersql, so the reverse import is the cycle itself (clustersql.go:4-9)"

        # 5/7 — internal/derived: the leaf property is a RULE, not the current
        # import list (derived.go:14-20). The DB-facing half of the contract
        # (store.ResolveSources) lives in store and calls INTO this package —
        # the same cut internal/visibility uses — and echo.go is an independent
        # implementation of the topiclabel/guard.go index rather than an import.
        derived-leaf:
          files:
            - "**/go/internal/derived/**"
          deny:
            - pkg: "github.com/GottZ/ctx/internal/store$"
              desc: "internal/derived must not import store, llm, blocktype or topiclabel — store calls INTO derived (store.ResolveSources), so the reverse import inverts the contract cut (derived.go:14-20)"
            - pkg: "github.com/GottZ/ctx/internal/llm$"
              desc: "internal/derived must not import store, llm, blocktype or topiclabel — the derived contract is checked without a model in the loop (derived.go:14-20)"
            - pkg: "github.com/GottZ/ctx/internal/blocktype$"
              desc: "internal/derived must not import store, llm, blocktype or topiclabel — the derived type vocabulary stays independent of the registry package (derived.go:14-20)"
            - pkg: "github.com/GottZ/ctx/internal/topiclabel$"
              desc: "internal/derived must not import store, llm, blocktype or topiclabel — echo.go is deliberately an independent implementation of the topiclabel/guard.go index, not an import (derived.go:14-20)"

        # 6/7 — internal/llmusage: THE reader of the hourly LLM-usage rollup
        # (design/06 §4.7, W06-4). Its consumers are the quota accountant
        # (internal/backends), the status rollups (internal/handler) and the
        # usage API, so it imports none of them and no config: the pgxdb
        # handle atoms, pgx and the standard library are all it needs
        # (llmusage/window.go package comment). Tests are exempt — the
        # integration test seeds through internal/testdb.
        llmusage-leaf:
          files:
            - "**/go/internal/llmusage/**"
            - "!$test"
          # The allow list is the whole rule: anything else is refused
          # ("not allowed from list 'llmusage-leaf'"). An import of one of
          # its consumers or of config/store fails earlier still, as an
          # import cycle (backends imports llmusage; config and store reach
          # backends).
          allow:
            - "$gostd"
            - "github.com/GottZ/ctx/internal/pgxdb$"
            - "github.com/jackc/pgx/v5"

        # 7/7 — internal/modelkey: the ctxm_ credential format of the model
        # API (design/01 §4.1, W01-2) — Base62 body from crypto/rand, CRC32
        # checksum, SHA-256 hash, hint. The store that mints keys, the knowledge
        # paths that refuse them and the /v1 middleware that checks them all
        # import it, so it imports none of them; and nothing third-party
        # either, because whatever it imports sits on every authentication
        # path. Hence allow = $gostd, with the ctx half carrying the message.
        # $gostd includes math/rand and math/rand/v2, and both are named
        # "rand" like crypto/rand — one wrong import and keys become
        # predictable while every test stays green (unique, uniform: a
        # seeded ChaCha8 passes both). The two denies close that.
        modelkey-leaf:
          files:
            - "**/go/internal/modelkey/**"
          allow:
            - "$gostd"
          deny:
            - pkg: "github.com/GottZ/ctx"
              desc: "internal/modelkey is the stdlib-only leaf that defines the ctxm_ model-key format — store, auth, handler and the /v1 middleware import it, so a ctx import here inverts that layering or closes a cycle (modelkey/modelkey.go package comment, design/01 §4.1)"
            - pkg: "math/rand$"
              desc: "model keys are secrets: their only randomness source is crypto/rand (modelkey.Generate) — math/rand is predictable, and no test can tell its output from crypto/rand's"
            - pkg: "math/rand/v2$"
              desc: "model keys are secrets: their only randomness source is crypto/rand (modelkey.Generate) — math/rand/v2 (also ChaCha8/PCG) is seedable and therefore predictable, and no test can tell its output from crypto/rand's"

        # 8 (a leaf by design since F-W2, after the seven above) —
        # internal/fedhop: the hop contract between ctx instances
        # (design/04 §4.1, F-W2): the instance identity now, the hop header
        # grammar, the hop token and the stamp of outgoing calls with the
        # waves that follow. llm, embed, rerank, backends, httpx and handler
        # import it, so it imports none of them and nothing of ctx at all —
        # the standard library only (fedhop/identity.go package comment).
        # Tests are included: the package needs nothing else to be tested.
        # The hop token is minted from crypto/rand (F-W3); math/rand would
        # make the nonce predictable while every uniqueness test stays green,
        # hence the two denies of modelkey-leaf.
        fedhop-leaf:
          files:
            - "**/go/internal/fedhop/**"
          allow:
            - "$gostd"
          deny:
            - pkg: "github.com/GottZ/ctx"
              desc: "internal/fedhop is the stdlib-only leaf of the hop contract between ctx instances — llm, embed, rerank, backends, httpx and handler import it, so a ctx import here inverts that layering or closes a cycle (fedhop/identity.go package comment, design/04 §4.1)"
            - pkg: "math/rand$"
              desc: "the hop token's nonce and the instance key are secrets: their only randomness source is crypto/rand — math/rand is predictable, and no test can tell its output from crypto/rand's"
            - pkg: "math/rand/v2$"
              desc: "the hop token's nonce and the instance key are secrets: their only randomness source is crypto/rand — math/rand/v2 (also ChaCha8/PCG) is seedable and therefore predictable, and no test can tell its output from crypto/rand's"

        # internal/federation (F-W9, design/04 §4.5–§4.7): the ingress policy
        # of the model API — PeerIngress, ResolvePolicy, ScanRaise,
        # FilterChain. It takes the consumer through an injected accessor and
        # policy values as arguments, so it needs neither the HTTP handlers
        # nor the store (config is refused by config-layering above): a
        # handler or store import here would let the policy reach around the
        # door it sits behind. The mesh test package fedtest is exempt — it
        # assembles the real stack (handler.LoopGuard) on purpose.
        federation-layering:
          files:
            - "**/go/internal/federation/**"
            - "!**/go/internal/federation/fedtest/**"
          deny:
            - pkg: "github.com/GottZ/ctx/internal/handler$"
              desc: "internal/federation takes the consumer through an injected accessor (PeerIngressConfig.Consumer) — importing handler inverts the layering of the /v1 stack (cmd/ctxd wires handler.ConsumerAuthFromContext in; design/04 §4.6, F-W9)"
            - pkg: "github.com/GottZ/ctx/internal/store$"
              desc: "internal/federation is pure policy over the request — no database: the consumer row arrives as auth.ConsumerAuth, the learned instances as a map (design/04 §4.5–§4.7, F-W9)"

        # evalscore stays TOOLING (design/06 §4.7, masterplan K18 + A-15).
        # internal/evalscore is the measurement vocabulary of the gold bench —
        # nDCG, MRR, recall, rank diversity. The server answers a query; it
        # does not grade its own answer, and a product package that reaches
        # for a scoring helper is measuring in the request path. T01-4 moved
        # the one primitive that was genuinely shared (TokenSet) to
        # internal/util and left internal/derived and internal/events without
        # an evalscore import; this rule is what keeps that cut instead of
        # letting it drift back one import at a time. Globs match absolute
        # paths (same as the rules above), and the negations carve out the
        # allowed consumers: the three tooling packages, the cmd/ctx-*
        # binaries — and the package itself, for its tests
        # (internal/evalscore/{rank,diversity}_test.go are package
        # evalscore_test and import it; golangci lints untagged tests).
        evalscore-tooling-only:
          files:
            - "!**/go/internal/armsweep/**"
            - "!**/go/internal/goldbench/**"
            - "!**/go/internal/goldset/**"
            - "!**/go/cmd/ctx-*/**"
            - "!**/go/internal/evalscore/**"
          deny:
            - pkg: "github.com/GottZ/ctx/internal/evalscore$"
              desc: "internal/evalscore is the tooling-side scoring vocabulary (nDCG, MRR, recall, diversity) — only internal/{armsweep,goldbench,goldset} and cmd/ctx-* may import it; a product package that needs a text primitive takes it from internal/util instead (T01-4, design/06 §4.7)"

    gosec:
      excludes:
        - G115
        - G304
        - G118
        - G706

    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*net/http.Response).Body.Close

    godot:
      scope: toplevel
      period: true

  exclusions:
    # npm-Pakete können Go-Portierungen mitliefern (z. B. flatted/golang);
    # go list ./... überspringt node_modules NICHT — ohne diese Exklusion
    # lintet der pre-commit-Hook Fremdcode.
    paths:
      - "web/node_modules/"
    rules:
      - path: "_test\\.go$"
        linters:
          - gosec
          - errcheck
          - cyclop
          - forbidigo
      - path: "testutil/"
        linters:
          - gosec
      # internal/pgxdb IST der eine Ort für Begin/Rollback/Commit (Achse 04):
      # die echten BeginTx-Aufrufe von Write/WriteOpts/Read/Probe stehen dort
      # und dürfen nicht gegen die eigene Regel laufen.
      - path: "internal/pgxdb/"
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
