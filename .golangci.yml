# golangci-lint v2 Konfiguration für ctx
# github.com/GottZ/ctx — GottZ 4-Way RRF | GottZ Scope Model | GottZ Guard
#
# Philosophie: Fehler finden, die Go vet nicht findet — keine Style-Polizei.
# Linter-Auswahl: sicherheitskritisch (errcheck, gosec) + Qualität (gocritic)
# + Korrektheit (staticcheck). Ausdrücklich KEIN gofmt/goimports-Zwang im CI
# (das macht der IDE-Save, nicht der CI-Block).

version: "2"

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - gosec
    - govet
    - ineffassign
    - cyclop
    - nilerr
    - errorlint
    - godot
    - depguard
    - forbidigo

  settings:
    cyclop:
      max-complexity: 25

    # MT 06-C5 / 03-W4 fail-open guard: a tenant-less config Snapshot() on a
    # REQUEST path silently serves the _global generation instead of the
    # tenant-resolved one — a cross-tenant config leak that compiles and passes
    # every test. There is no type-system signal for "this call should have been
    # SnapshotForRequest(ctx)", so the gate is a lint rule. analyze-types keys the
    # pattern on the RECEIVER TYPE, so it fires on config.Store / the handler-side
    # ConfigStore interface and NOT on backends.Pool.Snapshot() (a different
    # receiver) — empirically verified at build time. The $ anchor on .Snapshot
    # excludes SnapshotForRequest / SnapshotForTenant / SeedSnapshotForTest. Every
    # legitimate tenant-less site (server-global telemetry, the settings API
    # owner, the deliberately-gated audit/classify status, background retention)
    # carries an inline //nolint:forbidigo annotation naming its class
    # (BLIND/OWNER/gated/background). A NEW unannotated Snapshot() on a request
    # path fails the lint: classify it → SnapshotForRequest(ctx), or, if it is
    # genuinely tenant-less, annotate it like the rest. _test.go is excluded
    # below (test stores call Snapshot freely).
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^(.*config\.Store|.*ConfigStore)\.Snapshot$'
          msg: >-
            tenant-less config Snapshot() — a request path must call
            SnapshotForRequest(ctx) (fail-open cross-tenant config leak, MT
            06-C5/03-W4). If this site is genuinely tenant-less (server-global
            telemetry, settings-API owner, gated audit/classify, background
            retention) annotate it: //nolint:forbidigo // MT 06 BLIND/OWNER/gated/background: <reason>.

    # F1 layering rule (design/01-config-core.md §2.1): internal/config is
    # consumed ONLY by cmd/**, internal/handler, internal/events and
    # internal/settings (the F2 reload owner: settings.Reload = LoadOverrides
    # → config.Build → Store.Replace, design/02-settings-store.md §2.4).
    # Domain packages (llm, embed, dream, rrf, rerank, …) stay parameter-pure
    # — they receive backends.Backend tuples and plain values as arguments.
    # This kills config import cycles by design and keeps domain packages
    # trivially testable. Globs match absolute paths; the negations carve out
    # the allowed consumers (and the package itself, for its tests).
    depguard:
      rules:
        config-layering:
          files:
            - "!**/go/cmd/**"
            - "!**/go/internal/handler/**"
            - "!**/go/internal/events/**"
            - "!**/go/internal/settings/**"
            - "!**/go/internal/config/**"
          deny:
            - pkg: "github.com/GottZ/ctx/internal/config"
              desc: "internal/config may only be imported by cmd/**, internal/handler, internal/events, internal/settings (F1 layering rule — pass values as parameters instead)"

    gosec:
      excludes:
        - G115
        - G304
        - G118
        - G706

    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*net/http.Response).Body.Close

    godot:
      scope: toplevel
      period: true

  exclusions:
    # npm-Pakete können Go-Portierungen mitliefern (z. B. flatted/golang);
    # go list ./... überspringt node_modules NICHT — ohne diese Exklusion
    # lintet der pre-commit-Hook Fremdcode.
    paths:
      - "web/node_modules/"
    rules:
      - path: "_test\\.go$"
        linters:
          - gosec
          - errcheck
          - cyclop
          - forbidigo
      - path: "testutil/"
        linters:
          - gosec

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
