# ctx Release Pipeline — Multi-platform binaries
# Triggers on version tags (v*). Builds for 5 platforms, creates GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.14.0)"
        required: true

permissions: {}

# One run per tag at a time: a tag push and a manual dispatch for the same
# tag would otherwise land in different groups (refs/tags/v… vs
# refs/heads/root), pass the existence check together and share one draft
# with assets from two builds. A second run waits instead of cancelling the
# first or being displaced (`queue: max`: up to 100 waiting runs). The order
# among waiting runs is not guaranteed and does not matter: whichever runs
# after a published release stops at verify's existence check.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

env:
  GO_VERSION: "1.27"

jobs:
  # Gate before anything is built: the selected tag is a version tag, the
  # checkout IS the peeled tag commit, and that commit is on root. The tag
  # ruleset restricts who may create v* tags, not where they point; the
  # pre-push hook says the same earlier but can be skipped with --no-verify,
  # so this is the check that holds. A manual dispatch uses refs/tags/<input>
  # so a branch name can never satisfy it.
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - name: Checkout the release tag (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Tag is an annotated version tag on root, unreleased, with a green live tier
        id: check
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A manual run is the maintainer's: anyone with write may re-run or
          # dispatch workflows, and a rebuilt release would carry a new
          # main.date and new checksums.
          # GITHUB_TRIGGERING_ACTOR is who pressed the button; GITHUB_ACTOR
          # stays the original actor on a re-run.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${GITHUB_TRIGGERING_ACTOR:-$GITHUB_ACTOR}" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::manual release runs are limited to the repository owner (dispatched by ${GITHUB_TRIGGERING_ACTOR:-$GITHUB_ACTOR})"; exit 1
          fi
          # Anchored: a glob would accept v1.0.0";id;" — a valid git ref name.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a version tag (vMAJOR.MINOR.PATCH)"; exit 1
          fi
          # Annotated with real release notes — the annotation IS the
          # GitHub Release body (same rule as the pre-push hook, which can
          # be skipped; this one cannot).
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag — version tags are annotated (the annotation is the release body)"; exit 1
          fi
          NOTES_LEN="$(git tag -l --format='%(contents:subject)%0a%(contents:body)' "$TAG" | wc -c)"
          if [ "$NOTES_LEN" -lt 80 ]; then
            echo "::error::$TAG annotation is $NOTES_LEN chars; at least 80 are required for the release notes"; exit 1
          fi
          PEELED="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$PEELED" != "$HEAD_SHA" ]; then
            echo "::error::checkout $HEAD_SHA is not the commit tag $TAG points to ($PEELED)"; exit 1
          fi
          git fetch --no-tags --quiet origin root
          if ! git merge-base --is-ancestor "$PEELED" origin/root; then
            echo "::error::tag $TAG points to $PEELED, which is not on root — releases are cut on merged commits only (GOVERNANCE.md)"; exit 1
          fi
          # A published release is immutable: a second run for the same tag
          # (re-run, re-dispatch) must not replace its binaries, checksums or
          # provenance. Only a 404 means "no release yet"; an API error is not
          # permission to publish. publish repeats this check right before
          # the upload, because a job-level re-run reuses verify's result.
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" || echo 000)"
          case "$CODE" in
            404) ;;
            200) echo "::error::release $TAG already exists — published releases are not rebuilt (GOVERNANCE.md, Releases)"; exit 1 ;;
            *)   echo "::error::could not tell whether release $TAG exists (HTTP $CODE)"; exit 1 ;;
          esac
          # The live tier (real ctxd + Postgres, production write paths) runs
          # on every push to root; the tagged commit must have a green run.
          LIVE_OK="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PEELED}/check-runs?check_name=Web%20Live%20Tier&per_page=50" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [ "${LIVE_OK:-0}" -lt 1 ]; then
            echo "::error::no successful 'Web Live Tier' run on $PEELED — wait for the ci.yml run of the push that put it on root; if that run was cancelled by a later push, re-run it once no newer ci.yml run on root is queued or in progress, since a re-run keeps its ref and cancels the newer run (gh run rerun <run-id>; ci.yml publishes mutable image tags only from the current tip of root, so an older commit's re-run cannot re-point them — for a run from before that guard, re-run only its 'Web Live Tier' job, never the whole run), and then re-run this workflow"; exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${PEELED}" >> "$GITHUB_OUTPUT"
          echo "ok: $TAG -> $PEELED is on root"

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A tag push checks out that tag anyway; a manual dispatch would
          # otherwise build the branch the run was started from and label the
          # binaries with the input tag. refs/tags/<input> builds the selected
          # tag and nothing else — a missing tag fails the run at checkout.
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum

      - name: Determine version
        id: version
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${TAG}"

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: go
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # github.sha is the dispatch ref on a manual run, not the tag's commit.
          COMMIT="$(git rev-parse HEAD)"
          BINARY="../ctx-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X main.version=${TAG} \
              -X main.commit=${COMMIT} \
              -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "${BINARY}" \
            ./cmd/ctx/
          echo "Built: ${BINARY} ($(du -h "${BINARY}" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ctx-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 30

  # Build-Provenance (#49 Punkt 2): SHA256SUMS liegt neben den Binaries und
  # fängt einen kaputten Download, aber kein ausgetauschtes Release — beide
  # Dateien liegen am selben Ort. Die Attestation ist Sigstore-signiert über das
  # OIDC-Token dieses Workflow-Laufs und liegt in der Attestations-API des Repos:
  # `gh attestation verify <datei> -R GottZ/ctx`.
  #
  # Dasselbe Bundle hängt zusätzlich als ctx.intoto.jsonl am Release (OpenSSF
  # Scorecard, Check Signed-Releases: der liest nur Release-Assets nach
  # Dateiendung, nicht die Attestations-API). Offline prüfbar mit
  # `gh attestation verify <datei> --bundle ctx.intoto.jsonl -R GottZ/ctx`.
  #
  # Eigener Job statt eines Schritts in publish: id-token kann jeder Schritt des
  # Jobs anfordern, der es trägt. Hier läuft neben dem Download nur die
  # GitHub-eigene Attest-Action — kein Drittanbieter-Code (action-gh-release)
  # und kein contents: write teilen sich den Job mit dem Token. publish hängt
  # an diesem Job: ohne Attestation kein Release.
  attest:
    name: Attest Build Provenance
    runs-on: ubuntu-latest
    needs: [release]
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ctx-*

      # Eine Zeile pro Bundle (jq -c normalisiert JSON wie JSONL). publish lädt
      # alle Artefakte nach dist/ — so landet die Datei im Release und in
      # SHA256SUMS, ohne dass publish davon wissen muss.
      - name: Write provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir -p provenance
          jq -c . "$BUNDLE" > provenance/ctx.intoto.jsonl
          test -s provenance/ctx.intoto.jsonl
          wc -l provenance/ctx.intoto.jsonl

      - name: Upload provenance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctx-provenance
          path: provenance/ctx.intoto.jsonl
          retention-days: 30

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [verify, release, attest]
    permissions:
      contents: write

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Determine version
        id: version
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract tag annotation as release body
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Extract tag annotation (strips signature block, keeps message body)
          TAG_MSG=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG")
          if [ -z "$TAG_MSG" ] || [ "$TAG_MSG" = $'\n\n' ]; then
            TAG_MSG="Release $TAG"
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$TAG_MSG"
            echo ""
            echo "## Installation"
            echo ""
            echo "**With Go:**"
            echo '```bash'
            echo "go install github.com/GottZ/ctx/cmd/ctx@${TAG}"
            echo '```'
            echo ""
            echo "**Binary download:**"
            echo "Download the binary for your platform (and SHA256SUMS), verify both, then install:"
            echo '```bash'
            echo "gh attestation verify ctx-<os>-<arch> -R GottZ/ctx   # signed build provenance"
            echo "# offline: add --bundle ctx.intoto.jsonl (Sigstore bundle attached to this release)"
            echo "sha256sum -c --ignore-missing SHA256SUMS            # download integrity"
            echo "chmod +x ctx-*"
            echo "sudo mv ctx-* /usr/local/bin/ctx"
            echo '```'
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Prüfsummen (Sweep 2026-09-19): die Binaries lagen ohne Integritätsanker
      # im Release. SHA256SUMS entsteht NACH dem Download aller Plattform-
      # Artefakte und wird mit hochgeladen (files: dist/*).
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Same check as in verify, repeated here: re-running this job alone (or
      # release + its dependents) reuses verify's outputs and would otherwise
      # publish again onto an existing release.
      - name: Release does not exist yet; a leftover draft is removed
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" || echo 000)"
          case "$CODE" in
            404) echo "ok: no published release $TAG" ;;
            200) echo "::error::release $TAG already exists — published releases are not rebuilt (GOVERNANCE.md, Releases)"; exit 1 ;;
            *)   echo "::error::could not tell whether release $TAG exists (HTTP $CODE)"; exit 1 ;;
          esac
          # The by-tag endpoint answers 404 for drafts. A draft for this tag is
          # a leftover of a run that died between create and upload; the
          # release action would resume it and mix its assets with this
          # build's. Runs are serialized per tag (concurrency above), so a
          # draft here is never a concurrent run's — delete it, then publish
          # a release whose assets, SHA256SUMS and provenance are one build.
          # Every page, not the newest 100: the action looks further back for
          # a draft to resume (two pages in v3.0.3), and this repository has
          # more releases than one page holds. A failing page fails the step.
          DRAFTS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .tag_name == \"${TAG}\") | .id")"
          for id in $DRAFTS; do
            echo "removing leftover draft release ${id} for ${TAG}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ctx ${{ steps.version.outputs.tag }}
          generate_release_notes: false
          files: dist/*
          # Never replace an asset that is already there — belt to the check above.
          overwrite_files: false
          body: ${{ steps.notes.outputs.body }}
