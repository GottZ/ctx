# e2e live-tier stack (design 06 §4.7, wave PV10). A THROWAWAY ctxd + Postgres
# provisioned per run: the DB dies with the stack, so every key minted here
# (the per-run bootstrap key + all tenant owner keys) is valid ONLY against
# this ephemeral instance (§3.6 invariant 3 — a key leak via a trace artifact
# has impact null). NEVER point this at a real deployment.
#
# The per-run bootstrap key + run id are GENERATED by run-live.sh and passed in
# via the environment (CTX_BOOTSTRAP_ADMIN_KEY / CTX_BOOTSTRAP_RUN_ID). ctxd's
# PV10a fail-closed bootstrap mints the first server-admin key from them ONLY
# because this DB starts empty. The seed's target-gate then verifies it holds
# exactly that per-run key before writing anything (§3.6 handshake).
#
# Ports (design 06 host-port trap): mailcow owns 127.0.0.1:8080 and the mock
# tier owns 5179 — this stack uses its OWN high port 18099 for ctxd and does
# NOT publish Postgres to the host at all (ctxd reaches it over the compose
# network). Use a dedicated project name: `docker compose -p ctx-e2e-live`.
services:
  db:
    image: timescale/timescaledb-ha:pg18
    environment:
      POSTGRES_DB: context_store
      POSTGRES_USER: context_user
      POSTGRES_PASSWORD: ${CTX_E2E_DB_PASSWORD}
    # First-init hook: enable the timescaledb extension (no migration creates
    # it — production relies on its own init-data.sh; the CI integration suite
    # does the same CREATE EXTENSION manually, testdb/setup.go). vector /
    # pg_trgm / pgcrypto are enabled by migration 001, so this is the only gap.
    volumes:
      - ./initdb.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    tmpfs:
      # Ephemeral storage: the corpus is thrown away with the stack (no volume).
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_user -d context_store"]
      interval: 2s
      timeout: 3s
      retries: 30

  ctx:
    build:
      # Context is go/ (three levels up from e2e/live/): the release Dockerfile
      # builds the frontend stage AND embeds the real SPA — verify-lens =
      # release-lens (§4.7). The Stage-4 binary artifact only embeds the
      # dist/.gitkeep placeholder and is unusable for UI e2e.
      context: ../../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONTEXT_DB: context_store
      CONTEXT_DB_USER: context_user
      CONTEXT_DB_PASSWORD: ${CTX_E2E_DB_PASSWORD}
      CONTEXT_DB_HOST: db
      CONTEXT_DB_PORT: "5432"
      LISTEN_ADDR: ":8080"
      # PV10a fail-closed first-key bootstrap (§3.6): the seed authenticates as
      # exactly this key and expects the label e2e-bootstrap-<run-id>.
      CTX_BOOTSTRAP_ADMIN_KEY: ${CTX_BOOTSTRAP_ADMIN_KEY}
      CTX_BOOTSTRAP_RUN_ID: ${CTX_BOOTSTRAP_RUN_ID}
    ports:
      - "127.0.0.1:18099:8080"
    # No container healthcheck. Since β1 (E9) `/ctx -health` would in fact pass
    # here — it judges serving, not greenness, so this stack's deliberately
    # absent LLM backends no longer make it fail. It stays off because nothing
    # depends on ctx being "healthy" and a probe every 30s buys this throwaway
    # stack nothing; run-live.sh polls /api/whoami directly for readiness (any
    # HTTP status = serving), which is also the readiness signal a pre-β1 image
    # would need.
