  - heading "Recordings" [level=1]
  - paragraph: Requests of the consumers a server-admin set to record, held whole with the answer they got — credentials in a prompt included. Every view of a recording's content is written to the audit trail.
  - region "recording consumers":
    - heading "consumers" [level=2]
    - text: "3"
    - table "recording consumers":
