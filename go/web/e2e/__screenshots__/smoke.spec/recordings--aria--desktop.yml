          - cell "acme"
          - cell "on"
          - cell "active"
          - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ AM/
          - cell /\d+/
          - cell "1"
          - cell "1"
          - cell "0"
        - row /old-bot globex off inactive \d+\/\d+\/\d+, \d+:\d+:\d+ AM — — — —/:
          - cell "old-bot":
            - link "old-bot":
              - /url: /gateway/recordings/01900000-0000-7000-8000-00000000c576
          - cell "globex"
          - cell "off"
          - cell "inactive"
          - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ AM/
