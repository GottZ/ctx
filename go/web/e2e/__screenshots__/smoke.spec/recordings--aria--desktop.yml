          - cell /[0-9a-fA-F-]+/:
            - link /[0-9a-fA-F-]+/:
              - /url: /gateway/recordings/01900000-0000-7000-8000-00000000c577
          - cell "—"
          - cell "off"
          - cell "deleted"
          - cell /\d+\/\d+\/\d+, \d+:\d+:\d+ AM/
          - cell "—"
          - cell "—"
          - cell "—"
          - cell "—"
    - paragraph:
      - text: /Counts of this ctxd process since \d+\/\d+\/\d+, \d+:\d+:\d+ AM \(process/
      - code: 7a1c5e00
