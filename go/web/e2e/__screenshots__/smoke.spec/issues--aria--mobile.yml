- banner:
  - button "Open navigation menu"
  - link "ctx":
    - /url: /status
- main:
  - region "Issues":
    - heading "Issues" [level=1]
    - text: Project
    - code: Acme Main
    - search:
      - searchbox "Search issues"
      - button "Search"
      - text: Status
      - combobox "Filter by status":
        - option "All statuses" [selected]
        - option "open"
    - table "Issues":
      - rowgroup:
        - row "Title Status Updated":
          - columnheader "Title"
          - columnheader "Status"
          - columnheader "Updated"
      - rowgroup:
        - row /Example issue open \d+-\d+-\d+/:
          - cell "Example issue":
            - link "Example issue":
              - /url: /issues/11111111-1111-1111-1111-111111111111?scope=acme%3Amain
          - cell "open"
          - cell /\d+-\d+-\d+/:
            - time: /\d+-\d+-\d+/