- main:
  - paragraph:
    - link "← Recordings":
      - /url: /gateway/recordings
  - heading "rec-app" [level=1]
  - paragraph:
    - text: acme
    - code: /[0-9a-fA-F-]+/
    - text: · newest first · metadata and sizes only
  - form "filter recordings":
    - text: from (local time)
    - textbox "from (local time)":
      - /placeholder: YYYY-MM-DD HH:MM
    - text: until (local time)
    - textbox "until (local time)":
      - /placeholder: YYYY-MM-DD HH:MM
    - paragraph: YYYY-MM-DD, optionally with HH:MM or HH:MM:SS, in this browser's time zone; until is exclusive.
    - group "operation":
      - text: ""
      - checkbox "chat"
      - text: chat
      - checkbox "embed"
      - text: embed
      - checkbox "rerank"
      - text: rerank
      - checkbox "none"
      - text: none
    - text: state
    - combobox "state":
      - option "any" [selected]
      - option "open"
      - option "done"
    - text: status
    - combobox "status":
      - option "any" [selected]
      - option "2xx"
      - option "3xx"
      - option "4xx"
      - option "5xx"
      - option "none"
    - button "Apply"
    - button "Reset"
  - region "recordings":
    - heading "recordings" [level=2]
    - text: "7"
    - table "recordings":
