- main:
  - region "Model catalog":
    - heading "Model catalog" [level=1]
    - paragraph:
      - text: The model names external callers send to the OpenAI-compatible endpoint — each alias maps a name to a backend role, with a sensitivity floor and a policy. A tenant alias takes the place of a
      - code: _global
      - text: alias of the same name for that tenant.
    - button "+ New alias"
    - region "model aliases":
      - heading "aliases" [level=2]
      - text: "8"
      - region "model aliases, scrollable":
        - table "model aliases":
          - rowgroup:
            - row "scope name kind role sensitivity status actions":
              - columnheader "scope"
              - columnheader "name"
              - columnheader "kind"
              - columnheader "role"
              - columnheader "sensitivity"
              - columnheader "status"
              - columnheader "actions"
          - rowgroup:
            - 'row "_global chat chat images: on (backend) chat public enabled read-only"':
              - cell "_global"
              - cell "chat"
              - 'cell "chat images: on (backend)"'
              - cell "chat"
              - cell "public"
              - cell "enabled"
              - cell "read-only"
            - 'row "_global draft chat images: on (backend) chat public enabled read-only"':
              - cell "_global"
              - cell "draft"
              - 'cell "chat images: on (backend)"'
              - cell "chat"
              - cell "public"
              - cell "enabled"
              - cell "read-only"
            - row "_global embed embedding embedding public enabled read-only":
              - cell "_global"
              - cell "embed"
              - cell "embedding"
              - cell "embedding"
              - cell "public"
              - cell "enabled"
              - cell "read-only"
            - 'row "_global legacy chat images: off (no image-capable backend) chat-legacy public disabled read-only"':
              - cell "_global"
              - cell "legacy"
              - 'cell "chat images: off (no image-capable backend)"'
              - cell "chat-legacy"
              - cell "public"
              - cell "disabled"
              - cell "read-only"
            - 'row "_global vault chat images: off (policy) chat personal disabled read-only"':
              - cell "_global"
              - cell "vault"
              - 'cell "chat images: off (policy)"'
              - cell "chat"
              - cell "personal"
              - cell "disabled"
              - cell "read-only"
            - 'row "home chat chat images: on (backend) chat public enabled Edit alias chat Disable alias chat"':
              - cell "home"
              - cell "chat"
              - 'cell "chat images: on (backend)"'
              - cell "chat"
              - cell "public"
              - cell "enabled"
              - cell "Edit alias chat Disable alias chat":
                - button "Edit alias chat"
                - button "Disable alias chat"
            - 'row "home A-SENTINEL-1f9c62d84b7e chat images: on (backend) chat credentials disabled Edit alias A-SENTINEL-1f9c62d84b7e Enable alias A-SENTINEL-1f9c62d84b7e"':
              - cell "home"
              - cell "A-SENTINEL-1f9c62d84b7e"
              - 'cell "chat images: on (backend)"'
              - cell "chat"
              - cell "credentials"
              - cell "disabled"
              - cell "Edit alias A-SENTINEL-1f9c62d84b7e Enable alias A-SENTINEL-1f9c62d84b7e":
                - button "Edit alias A-SENTINEL-1f9c62d84b7e"
                - button "Enable alias A-SENTINEL-1f9c62d84b7e"
            - 'row "home draft chat images: on (policy) chat public disabled Edit alias draft Enable alias draft"':
              - cell "home"
              - cell "draft"
              - 'cell "chat images: on (policy)"'
              - cell "chat"
              - cell "public"
              - cell "disabled"
              - cell "Edit alias draft Enable alias draft":
                - button "Edit alias draft"
                - button "Enable alias draft"