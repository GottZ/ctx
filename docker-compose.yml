# ctx by GottZ — The memory your LLM pretends to have.
# GottZ 4-Way RRF | GottZ Scope Model | GottZ Guard
# https://github.com/GottZ/ctx

services:
  ctx:
    build:
      context: ./go
      dockerfile: Dockerfile
    container_name: ctx
    restart: unless-stopped
    labels:
      - "reversed.host=${CTX_HOSTNAME}"
      - "reversed.port=8080"
      - "reversed.ssl=${CTX_SSL_DOMAIN}"
    environment:
      # ── Contract of this block (generated, wave T05-5) ──────────────────────
      # Every env-fed registry key appears here exactly once, in registry order
      # (internal/config, `key`/`env` struct tags). The form ${NAME:-} sets the
      # variable EMPTY, and empty means "not set" to every reader in the tree
      # (config.FromEnv, overview.WorkerMemLimitBytes, schemacontract.ResolveMode)
      # — so the DEFAULT still comes from the registry, never from this file.
      # Pin a value in .env or through the settings API (`ctx settings set`),
      # not by writing a literal here: a literal that equals the registry default
      # is a second source of truth and goes red in
      # internal/config/compose_surface_test.go. Only two classes of line carry a
      # value at all — the container wiring (CONTEXT_DB*, LISTEN_ADDR) and four
      # deliberate deviations from the registry default, each with its reason in
      # the comment above it.
      # Regenerate: .project/plan-treeshake-2026-09-03/artefakte/T05-5-compose-env.py

      # ── server.* (8) ──
      CONTEXT_DB: ${CONTEXT_DB}
      CONTEXT_DB_USER: ${CONTEXT_DB_USER}
      CONTEXT_DB_PASSWORD: ${CONTEXT_DB_PASSWORD}
      CONTEXT_DB_HOST: db
      CONTEXT_DB_PORT: 5432
      CONTEXT_DB_SSLMODE: ${CONTEXT_DB_SSLMODE:-}
      LISTEN_ADDR: ":8080"
      CTX_INSTANCE_KIND: ${CTX_INSTANCE_KIND:-}

      # ── dream.* (16) ──
      # Backend topology — the endpoints themselves (host, protocol, model,
      # num_ctx, think, API key, per role chat / synthesis / embed / dream /
      # dream-embed / rerank) — is NOT configured here. It lives as rows in the
      # backend pool (`context_backends`, migration 053): `ctx backends` on the
      # CLI, /settings/backends in the web UI, `ctx init` or `ctx backends seed`
      # on a fresh install. The 29 CTX_{CHAT,CHAT_FALLBACK,EMBED,DREAM,
      # DREAM_EMBED,RERANK}_* declarations that stood here are retired in
      # v5.0.0: nothing reads them any more, and leaving them in a .env is
      # inert. Upgrade path and the reason: docs/operations.md.
      CTX_DREAM_ENABLED: ${CTX_DREAM_ENABLED:-}
      CTX_DREAM_IDLE_WAIT: ${CTX_DREAM_IDLE_WAIT:-}
      CTX_DREAM_PARALLELISM: ${CTX_DREAM_PARALLELISM:-}
      CTX_DREAM_LANGUAGE: ${CTX_DREAM_LANGUAGE:-}
      CTX_DREAM_JSON_MODE: ${CTX_DREAM_JSON_MODE:-}
      CTX_DREAM_DECIDE_MODE: ${CTX_DREAM_DECIDE_MODE:-}
      CTX_DREAM_DECIDE_TIE_ODDS: ${CTX_DREAM_DECIDE_TIE_ODDS:-}
      CTX_DREAM_LINK_FLOOR_CONFIDENCE: ${CTX_DREAM_LINK_FLOOR_CONFIDENCE:-}
      CTX_DREAM_TEMPORAL_TIMEOUT: ${CTX_DREAM_TEMPORAL_TIMEOUT:-}
      CTX_DREAM_CYCLE_TIMEOUT: ${CTX_DREAM_CYCLE_TIMEOUT:-}
      CTX_DREAM_NUM_PREDICT: ${CTX_DREAM_NUM_PREDICT:-}
      CTX_DREAM_EVAL_CAP_RETRY_FACTOR: ${CTX_DREAM_EVAL_CAP_RETRY_FACTOR:-}
      CTX_DREAM_BACKOFF_MODE: ${CTX_DREAM_BACKOFF_MODE:-}
      CTX_DREAM_BACKOFF_FACTOR: ${CTX_DREAM_BACKOFF_FACTOR:-}
      CTX_DREAM_BACKOFF_GRACE: ${CTX_DREAM_BACKOFF_GRACE:-}
      CTX_DREAM_BACKOFF_CAP: ${CTX_DREAM_BACKOFF_CAP:-}
      CTX_DREAM_BACKOFF_MIN: ${CTX_DREAM_BACKOFF_MIN:-}
      CTX_DREAM_BACKOFF_INERT_OFFSET: ${CTX_DREAM_BACKOFF_INERT_OFFSET:-}

      # ── rerank.* (3) ──
      # Reranker (post-RRF re-score). Opt-in since v5.0.0, and the default is
      # OFF for the same reason the tuples above are gone: whether a reranker
      # exists is a pool question, and a fresh install has no row of role
      # rerank. Without such a row the dispatch silently degrades to
      # LLM-as-judge on the chat model (~80-90s/query — proxy-safe via the
      # query body-heartbeat, but nobody chose it), so an ON default would sell
      # a slow path as a feature. The cross-encoder itself earns its keep where
      # a row does exist: the Wave-3.5 surface-gold counter-probe measured
      # nDCG@10 +0.164 and MRR +0.169 on judge-annotated answer gold, with
      # blend 0.5 neutral on latent gold (graph+ce-bw0.5 = best arm on BOTH
      # gold sets). To use the `ctx-rerank` sidecar below: create a pool row
      # targeting it (`ctx backends`), then set CTX_RERANK_ENABLED=true.
      # BLEND_WEIGHT/MAX_DOCS are cross-encoder sweep knobs (quality, not
      # latency — CPU rerank ~1s/doc is intentionally not a constraint; the
      # client timeout is sized for 50).
      CTX_RERANK_ENABLED: ${CTX_RERANK_ENABLED:-}
      CTX_RERANK_MAX_DOCS: ${CTX_RERANK_MAX_DOCS:-}
      # BLEND_WEIGHT default 0.5 (not 1.0): the Wave-3 sweep showed pure
      # cross-encoder (bw1.0) discards the RRF prior and re-ranks latent neighbors
      # down — and as final arbiter over graph-injected neighbors it is destructive
      # (R@10 0.715->0.571). bw0.5 keeps RRF/graph and is the only setting that
      # didn't hurt (graph+ce-bw0.5 R@20 0.811, best overall).
      CTX_RERANK_BLEND_WEIGHT: ${CTX_RERANK_BLEND_WEIGHT:-0.5}

      # ── graph.* (16) ──
      # Dream-graph expansion (Wave 1). Post-RRF stage that 1-hop-expands the top
      # RRF seeds along the positive Dream link types. Default ON since Wave 3: the
      # only arm that moves the recall ceiling (R@20 0.763 vs 0.625 for every
      # reorderer; a reorderer structurally cannot surface what RRF didn't return),
      # ~0s deterministic = zero latency cost. Caveat: the +31% R@10 magnitude is
      # partly circular (the eval gold is derived from these same Dream links);
      # the non-circular floor (graph surfaces link-gold RRF never finds) is what
      # justifies ON. Every value is a runtime knob.
      CTX_GRAPH_EXPAND_ENABLED: ${CTX_GRAPH_EXPAND_ENABLED:-true}
      CTX_GRAPH_EXPAND_DIRECTED: ${CTX_GRAPH_EXPAND_DIRECTED:-}
      CTX_GRAPH_EXPAND_HOP_DEPTH: ${CTX_GRAPH_EXPAND_HOP_DEPTH:-}
      CTX_GRAPH_EXPAND_SEED_COUNT: ${CTX_GRAPH_EXPAND_SEED_COUNT:-}
      CTX_GRAPH_EXPAND_SEED_SCORE_FLOOR: ${CTX_GRAPH_EXPAND_SEED_SCORE_FLOOR:-}
      CTX_GRAPH_EXPAND_PER_SEED_CAP: ${CTX_GRAPH_EXPAND_PER_SEED_CAP:-}
      CTX_GRAPH_EXPAND_MAX_INJECTED: ${CTX_GRAPH_EXPAND_MAX_INJECTED:-}
      CTX_GRAPH_EXPAND_MIN_CONFIDENCE: ${CTX_GRAPH_EXPAND_MIN_CONFIDENCE:-}
      CTX_GRAPH_EXPAND_MIN_CONFIDENCE_RECURRENT: ${CTX_GRAPH_EXPAND_MIN_CONFIDENCE_RECURRENT:-}
      CTX_GRAPH_EXPAND_BOOST_WEIGHT: ${CTX_GRAPH_EXPAND_BOOST_WEIGHT:-}
      CTX_GRAPH_EXPAND_HUB_DAMPING: ${CTX_GRAPH_EXPAND_HUB_DAMPING:-}
      CTX_GRAPH_EXPAND_WEIGHT_TOPICAL: ${CTX_GRAPH_EXPAND_WEIGHT_TOPICAL:-}
      CTX_GRAPH_EXPAND_WEIGHT_FACTUAL: ${CTX_GRAPH_EXPAND_WEIGHT_FACTUAL:-}
      CTX_GRAPH_EXPAND_WEIGHT_CAUSAL: ${CTX_GRAPH_EXPAND_WEIGHT_CAUSAL:-}
      CTX_GRAPH_EXPAND_WEIGHT_RECURRENT: ${CTX_GRAPH_EXPAND_WEIGHT_RECURRENT:-}
      CTX_GRAPH_EXPAND_NEW_PLACEMENT_FRAC: ${CTX_GRAPH_EXPAND_NEW_PLACEMENT_FRAC:-}

      # ── graph_overview.* (22) ──
      # Graph overview "landkarte" (F5-W6): the Louvain cluster-supergraph rebuild
      # job (gonum, offline in the scheduler) + GET /api/graph/overview. ENABLED
      # gates BOTH the job and the endpoint (off ⇒ 404). REBUILD_INTERVAL takes
      # seconds (default 6h); RESOLUTION is the Louvain γ (higher ⇒ more, smaller
      # clusters). First build runs at boot when ENABLED and the tables are empty.
      #
      # Declared COMPLETELY here since wave W6 (Cluster-Topic-Map). The block
      # used to carry three of the group's keys — leaving out MAX_NODES and
      # REBUILD_TIMEOUT, i.e. exactly the two liveness guards that have to be
      # reachable FIRST at scale. A knob the container cannot receive is not a
      # knob.
      CTX_GRAPH_OVERVIEW_ENABLED: ${CTX_GRAPH_OVERVIEW_ENABLED:-}
      CTX_GRAPH_OVERVIEW_REBUILD_INTERVAL: ${CTX_GRAPH_OVERVIEW_REBUILD_INTERVAL:-}
      CTX_GRAPH_OVERVIEW_RESOLUTION: ${CTX_GRAPH_OVERVIEW_RESOLUTION:-}
      # MAX_NODES is the load-bearing liveness cap (parse-strict): past ~200k
      # nodes Louvain hits a convergence wall, and a node set beyond the cap
      # skips the rebuild fail-safe rather than hanging it (0 = uncapped).
      # REBUILD_TIMEOUT bounds one run; the worker child is SIGKILLed on expiry.
      CTX_GRAPH_OVERVIEW_MAX_NODES: ${CTX_GRAPH_OVERVIEW_MAX_NODES:-}
      CTX_GRAPH_OVERVIEW_REBUILD_TIMEOUT: ${CTX_GRAPH_OVERVIEW_REBUILD_TIMEOUT:-}
      # TOMBSTONE_RETENTION (seconds, 45 d) is the window in which a dead topic
      # can still be re-attached to a re-appearing community — the batch-import
      # guard. 0 switches the re-attach off (fresh identities, never a wrong
      # revival). The purge of expired tombstones reads the same key.
      CTX_GRAPH_OVERVIEW_TOMBSTONE_RETENTION: ${CTX_GRAPH_OVERVIEW_TOMBSTONE_RETENTION:-}
      CTX_GRAPH_OVERVIEW_RUN_RETENTION: ${CTX_GRAPH_OVERVIEW_RUN_RETENTION:-}
      CTX_GRAPH_OVERVIEW_CSR_LOADER: ${CTX_GRAPH_OVERVIEW_CSR_LOADER:-}
      # ── Achse 04 (Skalen-Pfad): Substrat, Engine, Guards ─────────────────
      #
      # ENGINE waehlt den Rechenkern: gonum (Default) oder ctx (der eigene
      # Kern). Die Umschaltung ist ein EINMALIGER, GLOBALER Partitionsbruch —
      # jede cluster_id wird neu vergeben — und gehoert an einen angekuendigten
      # Release-Schnitt mit vorher erhoehtem TOMBSTONE_RETENTION, nicht in ein
      # beilaeufiges Deploy. Ein unbekannter Wert ist ein BOOT-Fehler, nie ein
      # stiller Fallback.
      #
      # Die Engine waehlt ausserdem den Knoten-Cap-KEY: MAX_NODES gilt fuer
      # gonum, MAX_NODES_CTX fuer den eigenen Kern. Bei engine=ctx ist der Cap
      # nur noch Not-Aus; tragender Guard ist dann TIME_BUDGET (Sekunden), das
      # die RECHENPHASE begrenzt und sauber abbricht, statt das Kind zu killen.
      #
      # CSR_LOADER schaltet das Eingabe-Substrat um (ergebnisgleich, deutlich
      # speicherguenstiger); engine=ctx impliziert es ohnehin. REFINE
      # garantiert zusammenhaengende Communities und wirkt nur bei engine=ctx.
      # v4.31.0 (UD-03-04, Board-Entscheid A2 2026-08-05): eigener Louvain/Leiden-Kern
      # als Live-Engine — Release-gebündelte Umschaltung, tombstone_retention deckt
      # den einmaligen Partitionsbruch (Grabstein-Gate >=80 % Re-Attach).
      CTX_GRAPH_OVERVIEW_ENGINE: ${CTX_GRAPH_OVERVIEW_ENGINE:-ctx}
      CTX_GRAPH_OVERVIEW_TIME_BUDGET: ${CTX_GRAPH_OVERVIEW_TIME_BUDGET:-}
      CTX_GRAPH_OVERVIEW_MAX_NODES_CTX: ${CTX_GRAPH_OVERVIEW_MAX_NODES_CTX:-}
      CTX_GRAPH_OVERVIEW_REFINE: ${CTX_GRAPH_OVERVIEW_REFINE:-}
      CTX_GRAPH_OVERVIEW_DELTA_PERSIST: ${CTX_GRAPH_OVERVIEW_DELTA_PERSIST:-}
      CTX_GRAPH_OVERVIEW_COMPONENT_SPLIT: ${CTX_GRAPH_OVERVIEW_COMPONENT_SPLIT:-}
      # WORKER_MEM_LIMIT deckelt den Heap des Rebuild-KINDES (Bytes, 0 = aus).
      # Default aus, und das ist Absicht: der heutige Rechenpfad hat am
      # 200k-Cap eine gemessene Spitze von ~423 MB — ein zu klein gewaehltes
      # Limit macht aus einem Speicher-SCHUTZ ein Speicher-VERBOT und friert
      # die Karte dauerhaft ein. Wert gegen peak_rss_kb aus graph_overview_run
      # waehlen; UD-02-04 nennt ~60 % des Container-Limits als Startpunkt.
      # Das Kind liest die Variable AUCH direkt aus der geerbten Umgebung, um
      # sich zu deckeln, bevor es Optionen hat.
      CTX_GRAPH_OVERVIEW_WORKER_MEM_LIMIT: ${CTX_GRAPH_OVERVIEW_WORKER_MEM_LIMIT:-}
      # Topic labelling (wave W6): the LLM half of the cluster names, over the
      # digest role. LABEL_ENABLED ships ON — unlike the rebuild gate — because
      # what keeps a small install quiet is LABEL_MIN_TOPICS, not an off switch:
      # below that many living topics per scope nothing is labelled at all, and
      # the deterministic fallback already names every topic. Language follows
      # CTX_DREAM_LANGUAGE (one language knob per corpus). LABEL_BATCH is the cap
      # per TICK across all scopes of the tenant served, LABEL_PROMPT_MAX_TITLES
      # a declared token budget. LABEL_CREDENTIALS_FALLBACK_ONLY is the opt-in
      # third hardening stage — the scan over the finished label and the echo
      # gate are unconditional, this one keeps credentials cores out of the model
      # path entirely.
      CTX_GRAPH_OVERVIEW_LABEL_ENABLED: ${CTX_GRAPH_OVERVIEW_LABEL_ENABLED:-}
      CTX_GRAPH_OVERVIEW_LABEL_INTERVAL: ${CTX_GRAPH_OVERVIEW_LABEL_INTERVAL:-}
      CTX_GRAPH_OVERVIEW_LABEL_BATCH: ${CTX_GRAPH_OVERVIEW_LABEL_BATCH:-}
      CTX_GRAPH_OVERVIEW_LABEL_MIN_TOPICS: ${CTX_GRAPH_OVERVIEW_LABEL_MIN_TOPICS:-}
      CTX_GRAPH_OVERVIEW_LABEL_PROMPT_MAX_TITLES: ${CTX_GRAPH_OVERVIEW_LABEL_PROMPT_MAX_TITLES:-}
      CTX_GRAPH_OVERVIEW_LABEL_CREDENTIALS_FALLBACK_ONLY: ${CTX_GRAPH_OVERVIEW_LABEL_CREDENTIALS_FALLBACK_ONLY:-}
      CTX_GRAPH_OVERVIEW_LABEL_TIMEOUT: ${CTX_GRAPH_OVERVIEW_LABEL_TIMEOUT:-}

      # ── root_map.* (8) ──
      # Root map (Achse 02, wave W-D): the cluster-per-line map that replaces
      # the block-per-line topic map. Written at the overview-rebuild cycle
      # under the title root-map-<scope>, category index, sensitivity internal,
      # capped at BUDGET_BYTES — the renderer MEASURES and stops, so the budget
      # is the deckel, never the target. ENABLED ships OFF: the wave is a no-op
      # deploy until it is flipped. COUNT_TIMEOUT caps the only O(corpus) step
      # (the coverage denominator); on expiry the map drops the denominator
      # instead of estimating it. The map produces no LLM labels and has no key
      # for capping them: the one declared here was retired without a successor,
      # for never having had a reader (v5.16.0, docs/operations.md).
      # The three SUPER_* knobs steer the meta-cluster level (W-F) and are
      # declared here without a consumer, so no later wave has to touch this
      # block again (K6). Durations are bare seconds.
      CTX_ROOT_MAP_ENABLED: ${CTX_ROOT_MAP_ENABLED:-}
      CTX_ROOT_MAP_BUDGET_BYTES: ${CTX_ROOT_MAP_BUDGET_BYTES:-}
      CTX_ROOT_MAP_SMALL_CLUSTER_MAX: ${CTX_ROOT_MAP_SMALL_CLUSTER_MAX:-}
      CTX_ROOT_MAP_FOOTER_RESERVE_BYTES: ${CTX_ROOT_MAP_FOOTER_RESERVE_BYTES:-}
      CTX_ROOT_MAP_COUNT_TIMEOUT: ${CTX_ROOT_MAP_COUNT_TIMEOUT:-}
      CTX_ROOT_MAP_SUPER_ENABLED: ${CTX_ROOT_MAP_SUPER_ENABLED:-}
      CTX_ROOT_MAP_SUPER_MIN_RESOLUTION: ${CTX_ROOT_MAP_SUPER_MIN_RESOLUTION:-}
      CTX_ROOT_MAP_SUPER_MAX_NODES: ${CTX_ROOT_MAP_SUPER_MAX_NODES:-}

      # ── digest.* (1) ──
      # Linear topic map (one line per BLOCK — 80 KB today, ~113 MB at 10M).
      # full = today's behaviour byte for byte (the shipped default: retiring the
      # old map is an operational step after the root map has proven itself, not
      # a deploy side effect) · stub = the map becomes a ~300 B pointer to
      # root-map-<scope>, so consumers searching for it still learn where to look
      # · off = no digest write at all, the block stays as it is. An unknown
      # value falls back to full and says so in the log.
      CTX_DIGEST_MODE: ${CTX_DIGEST_MODE:-}

      # ── graph_cache.* (10) ──
      CTX_GRAPH_CACHE_ENABLED: ${CTX_GRAPH_CACHE_ENABLED:-}
      CTX_GRAPH_CACHE_REBUILD_INTERVAL: ${CTX_GRAPH_CACHE_REBUILD_INTERVAL:-}
      CTX_GRAPH_CACHE_DEBOUNCE_WINDOW: ${CTX_GRAPH_CACHE_DEBOUNCE_WINDOW:-}
      CTX_GRAPH_CACHE_MIN_REBUILD_INTERVAL: ${CTX_GRAPH_CACHE_MIN_REBUILD_INTERVAL:-}
      CTX_GRAPH_CACHE_MAX_PENDING_AGE: ${CTX_GRAPH_CACHE_MAX_PENDING_AGE:-}
      CTX_GRAPH_CACHE_MAX_STALENESS: ${CTX_GRAPH_CACHE_MAX_STALENESS:-}
      CTX_GRAPH_CACHE_FAILED_THRESHOLD: ${CTX_GRAPH_CACHE_FAILED_THRESHOLD:-}
      CTX_GRAPH_CACHE_DEGREE_WALK_BUDGET: ${CTX_GRAPH_CACHE_DEGREE_WALK_BUDGET:-}
      CTX_GRAPH_CACHE_SERVE_EGO: ${CTX_GRAPH_CACHE_SERVE_EGO:-}
      CTX_GRAPH_CACHE_SERVE_EXPAND: ${CTX_GRAPH_CACHE_SERVE_EXPAND:-}

      # ── cluster.* (21) ──
      # Cluster consumption (Achse 03, wave C0): turns the Louvain clusters from
      # an output-only endpoint into a retrieval signal, a graph citizen and a
      # facet. The whole surface ships DARK — every gate below is false/0 and
      # arming one is a deliberate data flip after its wave landed. Declared
      # here COMPLETELY and in one place (K6) so no later wave has to touch the
      # compose block again; a knob the container cannot receive is not a knob,
      # which is exactly the gap the three-of-five CTX_GRAPH_OVERVIEW_* block
      # above still has. Ranking knobs (first group) are tenant-overridable,
      # wire/ops knobs (second group) are global-only. Durations are bare
      # seconds. SIZE_DAMPING ships ON: without it a mega cluster wins nearly
      # every query at scale (live Heavy-Tail: median 6 vs max 133 members).
      CTX_CLUSTER_ENABLED: ${CTX_CLUSTER_ENABLED:-}
      CTX_CLUSTER_SEED_COUNT: ${CTX_CLUSTER_SEED_COUNT:-}
      CTX_CLUSTER_TOP_CLUSTERS: ${CTX_CLUSTER_TOP_CLUSTERS:-}
      CTX_CLUSTER_MIN_SHARE: ${CTX_CLUSTER_MIN_SHARE:-}
      CTX_CLUSTER_BOOST_WEIGHT: ${CTX_CLUSTER_BOOST_WEIGHT:-}
      CTX_CLUSTER_SIZE_DAMPING: ${CTX_CLUSTER_SIZE_DAMPING:-}
      CTX_CLUSTER_CENTROID_ENABLED: ${CTX_CLUSTER_CENTROID_ENABLED:-}
      CTX_CLUSTER_CENTROID_WEIGHT: ${CTX_CLUSTER_CENTROID_WEIGHT:-}
      CTX_CLUSTER_CENTROID_TOP_K: ${CTX_CLUSTER_CENTROID_TOP_K:-}
      CTX_CLUSTER_INJECT_MAX: ${CTX_CLUSTER_INJECT_MAX:-}
      CTX_CLUSTER_MAX_STALENESS: ${CTX_CLUSTER_MAX_STALENESS:-}
      CTX_CLUSTER_EGO_ANNOTATE: ${CTX_CLUSTER_EGO_ANNOTATE:-}
      CTX_CLUSTER_EGO_ANNOTATE_MAX_NODES: ${CTX_CLUSTER_EGO_ANNOTATE_MAX_NODES:-}
      CTX_CLUSTER_FACET_ENABLED: ${CTX_CLUSTER_FACET_ENABLED:-}
      CTX_CLUSTER_ROUTE_ENABLED: ${CTX_CLUSTER_ROUTE_ENABLED:-}
      CTX_CLUSTER_CENTROID_BUILD: ${CTX_CLUSTER_CENTROID_BUILD:-}
      CTX_CLUSTER_CENTROID_TIMEOUT: ${CTX_CLUSTER_CENTROID_TIMEOUT:-}
      CTX_CLUSTER_CENTROID_BATCH: ${CTX_CLUSTER_CENTROID_BATCH:-}
      CTX_CLUSTER_CENTROID_WORK_MEM: ${CTX_CLUSTER_CENTROID_WORK_MEM:-}
      CTX_CLUSTER_CENTROID_ANN_THRESHOLD: ${CTX_CLUSTER_CENTROID_ANN_THRESHOLD:-}
      CTX_CLUSTER_CENTROID_EF_SEARCH: ${CTX_CLUSTER_CENTROID_EF_SEARCH:-}

      # ── query.* (7) ──
      CTX_SCORE_THRESHOLD: ${CTX_SCORE_THRESHOLD:-}
      CTX_CONFIDENT_THRESHOLD: ${CTX_CONFIDENT_THRESHOLD:-}
      CTX_PROMPT_VERSION: ${CTX_PROMPT_VERSION:-}
      CTX_TIMEZONE: ${CTX_TIMEZONE:-}
      CTX_RATE_LIMIT_WRITE: ${CTX_RATE_LIMIT_WRITE:-}
      CTX_RATE_LIMIT_READ: ${CTX_RATE_LIMIT_READ:-}
      CTX_SEMANTIC_FLOOR: ${CTX_SEMANTIC_FLOOR:-}

      # ── scheduler.* (2) ──
      # Scheduler ReadScopes (comma-separated). Background guard/digest/dream
      # operate on these scopes. Default = v1.x backwards-compat. v2.0.0 M045
      # dropped chk_scope, so any scope name is valid (no schema validation).
      # work-Scope abgebaut (User-Entscheid 2026-08-06): Daten archiviert (W-H),
      # Keys deaktiviert, Isolations-Tests laufen auf 'isotest' (test.sh).
      CTX_READ_SCOPES: ${CTX_READ_SCOPES:-private,shared}
      # Age after which the background janitor NULLs context_llm_log prompt/
      # response bodies (telemetry row survives — Body-NULLing, not a chunk
      # drop; audit stays lossless). 0 = keep bodies forever (no retention).
      CTX_LLMLOG_RETENTION_DAYS: ${CTX_LLMLOG_RETENTION_DAYS:-}

      # ── events.* (6) ──
      CTX_EVENTS_TICK_INTERVAL: ${CTX_EVENTS_TICK_INTERVAL:-}
      CTX_EVENTS_QUEUE_STATS_INTERVAL: ${CTX_EVENTS_QUEUE_STATS_INTERVAL:-}
      CTX_EVENTS_PING_INTERVAL: ${CTX_EVENTS_PING_INTERVAL:-}
      CTX_EVENTS_MAX_CONNECTIONS: ${CTX_EVENTS_MAX_CONNECTIONS:-}
      CTX_EVENTS_DB_STATS_INTERVAL: ${CTX_EVENTS_DB_STATS_INTERVAL:-}
      CTX_EVENTS_LLMCALL_COALESCE_THRESHOLD: ${CTX_EVENTS_LLMCALL_COALESCE_THRESHOLD:-}

      # ── project.* (6) ──
      CTX_PROJECT_SYNC_RATE_LIMIT: ${CTX_PROJECT_SYNC_RATE_LIMIT:-}
      CTX_PROJECT_SYNC_MAX_CONCURRENT: ${CTX_PROJECT_SYNC_MAX_CONCURRENT:-}
      CTX_PROJECT_EVENTS_MAX_CONNECTIONS: ${CTX_PROJECT_EVENTS_MAX_CONNECTIONS:-}
      CTX_PROJECT_EVENTS_FLUSH_INTERVAL: ${CTX_PROJECT_EVENTS_FLUSH_INTERVAL:-}
      CTX_PROJECT_EVENTS_PING_INTERVAL: ${CTX_PROJECT_EVENTS_PING_INTERVAL:-}
      CTX_PROJECT_EVENTS_COALESCE_THRESHOLD: ${CTX_PROJECT_EVENTS_COALESCE_THRESHOLD:-}

      # ── webhook.* (2) ──
      CTX_WEBHOOK_RATE_LIMIT: ${CTX_WEBHOOK_RATE_LIMIT:-}
      CTX_WEBHOOK_RETENTION: ${CTX_WEBHOOK_RETENTION:-}

      # ── llmlog.* (1) ──
      CTX_LLMLOG_MAX_LIMIT: ${CTX_LLMLOG_MAX_LIMIT:-}

      # ── webchat.* (9) ──
      # Web-chat harness (F6). ENABLED gates POST /api/chat/stream + the session
      # routes (off ⇒ 404). The integer budgets cap one turn; CONCURRENT_TURNS
      # is the per-home_scope semaphore (429 above it) that bounds turn frequency
      # on the single llama.cpp slot. SESSION_RETENTION takes a duration suffix
      # (h/d/w/m/y); 0 = keep sessions forever (the janitor stays off).
      CTX_WEBCHAT_ENABLED: ${CTX_WEBCHAT_ENABLED:-}
      CTX_WEBCHAT_MAX_ITERATIONS: ${CTX_WEBCHAT_MAX_ITERATIONS:-}
      CTX_WEBCHAT_MAX_TOKENS: ${CTX_WEBCHAT_MAX_TOKENS:-}
      CTX_WEBCHAT_COMPLETION_BUDGET: ${CTX_WEBCHAT_COMPLETION_BUDGET:-}
      CTX_WEBCHAT_TOOL_RESULT_MAX_CHARS: ${CTX_WEBCHAT_TOOL_RESULT_MAX_CHARS:-}
      CTX_WEBCHAT_HISTORY_BUDGET_CHARS: ${CTX_WEBCHAT_HISTORY_BUDGET_CHARS:-}
      CTX_WEBCHAT_LLM_TIMEOUT: ${CTX_WEBCHAT_LLM_TIMEOUT:-}
      CTX_WEBCHAT_CONCURRENT_TURNS: ${CTX_WEBCHAT_CONCURRENT_TURNS:-}
      CTX_WEBCHAT_SESSION_RETENTION: ${CTX_WEBCHAT_SESSION_RETENTION:-}

      # ── writes.* (2) ──
      CTX_WRITES_CONFIRM_TTL: ${CTX_WRITES_CONFIRM_TTL:-}
      CTX_WRITES_CONFIRM_RETENTION: ${CTX_WRITES_CONFIRM_RETENTION:-}

      # ── dispatch.* (9) ──
      CTX_DISPATCH_ENABLED: ${CTX_DISPATCH_ENABLED:-}
      CTX_DISPATCH_BACKGROUND_QUEUE_MAX: ${CTX_DISPATCH_BACKGROUND_QUEUE_MAX:-}
      CTX_DISPATCH_INTERACTIVE_QUEUE_PER_PRINCIPAL: ${CTX_DISPATCH_INTERACTIVE_QUEUE_PER_PRINCIPAL:-}
      CTX_DISPATCH_INTERACTIVE_QUEUE_PER_TENANT: ${CTX_DISPATCH_INTERACTIVE_QUEUE_PER_TENANT:-}
      CTX_DISPATCH_INTERACTIVE_QUEUE_MAX: ${CTX_DISPATCH_INTERACTIVE_QUEUE_MAX:-}
      CTX_DISPATCH_LEASE_REAP_GRACE: ${CTX_DISPATCH_LEASE_REAP_GRACE:-}
      CTX_DISPATCH_LEASE_MAX_AGE: ${CTX_DISPATCH_LEASE_MAX_AGE:-}
      CTX_DISPATCH_PREEMPT_RELEASE_TIMEOUT: ${CTX_DISPATCH_PREEMPT_RELEASE_TIMEOUT:-}
      CTX_DISPATCH_BACKGROUND_AGING_AFTER: ${CTX_DISPATCH_BACKGROUND_AGING_AFTER:-}

      # ── contract.* (2) ──
      CTX_CONTRACT_MODE: ${CTX_CONTRACT_MODE:-}
      CTX_CONTRACT_RECHECK_INTERVAL: ${CTX_CONTRACT_RECHECK_INTERVAL:-}

      # ── status.* (1) ──
      CTX_STATUS_CHANNEL_PROBE_INTERVAL: ${CTX_STATUS_CHANNEL_PROBE_INTERVAL:-}

      # ── embed_backfill.* (6) ──
      CTX_EMBED_BACKFILL_SYNC_CAP: ${CTX_EMBED_BACKFILL_SYNC_CAP:-}
      CTX_EMBED_BACKFILL_SYNC_BUDGET: ${CTX_EMBED_BACKFILL_SYNC_BUDGET:-}
      CTX_EMBED_BACKFILL_INTERVAL: ${CTX_EMBED_BACKFILL_INTERVAL:-}
      CTX_EMBED_BACKFILL_MAX_TOKENS: ${CTX_EMBED_BACKFILL_MAX_TOKENS:-}
      CTX_EMBED_BACKFILL_BACKOFF_BASE: ${CTX_EMBED_BACKFILL_BACKOFF_BASE:-}
      CTX_EMBED_BACKFILL_BACKOFF_CAP: ${CTX_EMBED_BACKFILL_BACKOFF_CAP:-}

      # ── embed_migration.* (7) ──
      CTX_EMBED_MIGRATION_BATCH_PER_CYCLE: ${CTX_EMBED_MIGRATION_BATCH_PER_CYCLE:-}
      CTX_EMBED_MIGRATION_MAX_TOKENS: ${CTX_EMBED_MIGRATION_MAX_TOKENS:-}
      CTX_EMBED_MIGRATION_BACKOFF_BASE: ${CTX_EMBED_MIGRATION_BACKOFF_BASE:-}
      CTX_EMBED_MIGRATION_BACKOFF_CAP: ${CTX_EMBED_MIGRATION_BACKOFF_CAP:-}
      CTX_EMBED_MIGRATION_VERIFY_SAMPLE_N: ${CTX_EMBED_MIGRATION_VERIFY_SAMPLE_N:-}
      CTX_EMBED_MIGRATION_VERIFY_OVERLAP_K: ${CTX_EMBED_MIGRATION_VERIFY_OVERLAP_K:-}
      CTX_EMBED_MIGRATION_VERIFY_OVERLAP_SAMPLES: ${CTX_EMBED_MIGRATION_VERIFY_OVERLAP_SAMPLES:-}

      # ── recall_check.* (13) ──
      CTX_RECALL_CHECK_ENABLED: ${CTX_RECALL_CHECK_ENABLED:-}
      CTX_RECALL_CHECK_INTERVAL: ${CTX_RECALL_CHECK_INTERVAL:-}
      CTX_RECALL_CHECK_OFFPEAK_HOUR: ${CTX_RECALL_CHECK_OFFPEAK_HOUR:-}
      CTX_RECALL_CHECK_K_LIST: ${CTX_RECALL_CHECK_K_LIST:-}
      CTX_RECALL_CHECK_QUERIES: ${CTX_RECALL_CHECK_QUERIES:-}
      CTX_RECALL_CHECK_STRATA_BOUNDS: ${CTX_RECALL_CHECK_STRATA_BOUNDS:-}
      CTX_RECALL_CHECK_EXACT_BUDGET_MS: ${CTX_RECALL_CHECK_EXACT_BUDGET_MS:-}
      CTX_RECALL_CHECK_EXACT_TOUCH_BUDGET: ${CTX_RECALL_CHECK_EXACT_TOUCH_BUDGET:-}
      CTX_RECALL_CHECK_LEG_TIMEOUT_MS: ${CTX_RECALL_CHECK_LEG_TIMEOUT_MS:-}
      CTX_RECALL_CHECK_PARK_MAX_MS: ${CTX_RECALL_CHECK_PARK_MAX_MS:-}
      CTX_RECALL_CHECK_EF_SEARCH: ${CTX_RECALL_CHECK_EF_SEARCH:-}
      CTX_RECALL_CHECK_EPSILON: ${CTX_RECALL_CHECK_EPSILON:-}
      CTX_RECALL_CHECK_RETENTION_DAYS: ${CTX_RECALL_CHECK_RETENTION_DAYS:-}

      # ── retrieval.* (5) ──
      CTX_RETRIEVAL_SELECTOR_ENABLED: ${CTX_RETRIEVAL_SELECTOR_ENABLED:-}
      CTX_RETRIEVAL_SELECTOR_EXACT_MAX: ${CTX_RETRIEVAL_SELECTOR_EXACT_MAX:-}
      CTX_RETRIEVAL_SELECTOR_GREY_MAX: ${CTX_RETRIEVAL_SELECTOR_GREY_MAX:-}
      CTX_RETRIEVAL_SELECTOR_GREY_SCAN_TUPLES: ${CTX_RETRIEVAL_SELECTOR_GREY_SCAN_TUPLES:-}
      CTX_RETRIEVAL_SELECTOR_STATS_TTL: ${CTX_RETRIEVAL_SELECTOR_STATS_TTL:-}

      # ── distill.* (32) ──
      CTX_DISTILL_ENABLED: ${CTX_DISTILL_ENABLED:-}
      CTX_DISTILL_CTX_ENABLED: ${CTX_DISTILL_CTX_ENABLED:-}
      CTX_DISTILL_CTX_SOURCE_LABEL: ${CTX_DISTILL_CTX_SOURCE_LABEL:-}
      CTX_DISTILL_CTX_QUIET_FOR: ${CTX_DISTILL_CTX_QUIET_FOR:-}
      CTX_DISTILL_CTX_SESSION_HORIZON: ${CTX_DISTILL_CTX_SESSION_HORIZON:-}
      CTX_DISTILL_INTERVAL: ${CTX_DISTILL_INTERVAL:-}
      CTX_DISTILL_MAX_SESSIONS_PER_RUN: ${CTX_DISTILL_MAX_SESSIONS_PER_RUN:-}
      CTX_DISTILL_CONCURRENCY: ${CTX_DISTILL_CONCURRENCY:-}
      CTX_DISTILL_ROWS_PER_READ: ${CTX_DISTILL_ROWS_PER_READ:-}
      CTX_DISTILL_MIN_ROW_RUNES: ${CTX_DISTILL_MIN_ROW_RUNES:-}
      CTX_DISTILL_MAX_ROW_RUNES: ${CTX_DISTILL_MAX_ROW_RUNES:-}
      CTX_DISTILL_ROWS_PER_CALL: ${CTX_DISTILL_ROWS_PER_CALL:-}
      CTX_DISTILL_DRYRUN_DIR: ${CTX_DISTILL_DRYRUN_DIR:-}
      CTX_DISTILL_INITIAL_BACKFILL_ROWS: ${CTX_DISTILL_INITIAL_BACKFILL_ROWS:-}
      CTX_DISTILL_CALL_TIMEOUT: ${CTX_DISTILL_CALL_TIMEOUT:-}
      CTX_DISTILL_NUM_PREDICT: ${CTX_DISTILL_NUM_PREDICT:-}
      CTX_DISTILL_SCOPE: ${CTX_DISTILL_SCOPE:-}
      CTX_DISTILL_CATEGORY: ${CTX_DISTILL_CATEGORY:-}
      CTX_DISTILL_BLOCK_TYPE: ${CTX_DISTILL_BLOCK_TYPE:-}
      CTX_DISTILL_CHECKPOINT_CATEGORY: ${CTX_DISTILL_CHECKPOINT_CATEGORY:-}
      CTX_DISTILL_MAX_BLOCK_RUNES: ${CTX_DISTILL_MAX_BLOCK_RUNES:-}
      CTX_DISTILL_MAX_BLOCKS_PER_ROOT: ${CTX_DISTILL_MAX_BLOCKS_PER_ROOT:-}
      CTX_DISTILL_BLOCK_SENSITIVITY: ${CTX_DISTILL_BLOCK_SENSITIVITY:-}
      CTX_DISTILL_NOVELTY_FLOOR: ${CTX_DISTILL_NOVELTY_FLOOR:-}
      CTX_DISTILL_SPEND_WINDOW: ${CTX_DISTILL_SPEND_WINDOW:-}
      CTX_DISTILL_SPEND_MAX_CALLS: ${CTX_DISTILL_SPEND_MAX_CALLS:-}
      CTX_DISTILL_SPEND_MAX_GPU_SECONDS: ${CTX_DISTILL_SPEND_MAX_GPU_SECONDS:-}
      CTX_DISTILL_SPEND_BACKOFF: ${CTX_DISTILL_SPEND_BACKOFF:-}
      CTX_DISTILL_BREAKER_FAILURES: ${CTX_DISTILL_BREAKER_FAILURES:-}
      CTX_DISTILL_BREAKER_COOLDOWN: ${CTX_DISTILL_BREAKER_COOLDOWN:-}
      CTX_DISTILL_RETENTION_DAYS: ${CTX_DISTILL_RETENTION_DAYS:-}
      CTX_DISTILL_SEEN_RETENTION_DAYS: ${CTX_DISTILL_SEEN_RETENTION_DAYS:-}

      # ── env-only names (deliberately NOT in the config registry) ──
      # These have no settings key and no registry default: they are read
      # straight from the environment, so a .env value only reaches the
      # daemon through a declaration here. Their prose below says why each
      # one cannot live in the DB-backed settings layer.
      # Sealbox master key (env-only by design — the key that unseals DB rows
      # can never itself live in the DB). _PREV only while a §3.6 rotation
      # sweep is pending. Without this declaration the secrets API answers
      # 503 although .env carries the key (compose gap, found live G17).
      CTX_SECRETS_KEY: ${CTX_SECRETS_KEY:-}
      CTX_SECRETS_KEY_PREV: ${CTX_SECRETS_KEY_PREV:-}
      # First-boot admin mint (design: henhouse egg). Same compose-gap class
      # as CTX_SECRETS_KEY above (G17): .env alone is not enough, the
      # declaration must exist here. Unset => no-op; populated key table =>
      # the mint refuses (fail-closed, cmd/ctxd bootstrapAdminKeyBoot).
      # RUN_ID only names the label e2e-bootstrap-<run-id> (default: unknown).
      CTX_BOOTSTRAP_ADMIN_KEY: ${CTX_BOOTSTRAP_ADMIN_KEY:-}
      CTX_BOOTSTRAP_RUN_ID: ${CTX_BOOTSTRAP_RUN_ID:-}
      # Settings-layer kill switch (settings/reload.go EnvDisable). Env-only
      # BY DESIGN — the switch that turns off DB overrides cannot itself be a
      # DB override — hence the same compose-gap class: undeclared here, a
      # .env value never reaches the daemon. Empty = layer active.
      CTX_SETTINGS_DISABLE: ${CTX_SETTINGS_DISABLE:-}
      # Camo image proxy (design 07-camo). Fail-closed: without ENABLED=true
      # both /api/img routes 404 and the SPA keeps its placeholder. Same
      # compose-gap class as CTX_SECRETS_KEY above (G17): .env alone is not
      # enough, the declaration must exist here.
      CTX_CAMO_ENABLED: ${CTX_CAMO_ENABLED:-}
      CTX_CAMO_TTL: ${CTX_CAMO_TTL:-}
      CTX_CAMO_MAX_BYTES: ${CTX_CAMO_MAX_BYTES:-}
      # OAuth S2 (design 03 W03-2): canonical issuer for RFC 9207 `iss` +
      # discovery documents — derived from the proxy hostname above; an
      # r.Host-derived iss would be client-influencable (RVW-Spec-F4).
      # REDIRECT_EXTRA extends the static redirect allowlist per deployment
      # (comma-separated exact URIs; loopback is always allowed by rule).
      CTX_CANONICAL_ISSUER: ${CTX_CANONICAL_ISSUER:-https://${CTX_HOSTNAME}}
      CTX_OAUTH_REDIRECT_EXTRA: ${CTX_OAUTH_REDIRECT_EXTRA:-}
      # Token lifetimes + rotation cap (oauth.go:123-129): Go duration
      # overrides of decided values — the registry parses no duration format,
      # and all three are server-global while every registry key carries a
      # tenancy.
      CTX_OAUTH_ACCESS_TTL: ${CTX_OAUTH_ACCESS_TTL:-}
      CTX_OAUTH_REFRESH_TTL: ${CTX_OAUTH_REFRESH_TTL:-}
      CTX_OAUTH_FAMILY_CAP: ${CTX_OAUTH_FAMILY_CAP:-}
      # Dynamic client registration mode (oauth.go:175-181): fail-closed
      # open|admin|off switch over whether an unknown client may register at
      # all — cannot be reachable through the API it gates.
      CTX_OAUTH_DCR_MODE: ${CTX_OAUTH_DCR_MODE:-}
      # Open-DCR guard (oauth_register_guard.go:1-5,29-37): resource backstop
      # and per-IP rate budget against table DoS, plus the one proxy hop
      # whose X-Forwarded-For appendix is trusted for the per-IP count — none
      # of the three may be writable through the surface they protect.
      CTX_OAUTH_MAX_CLIENTS: ${CTX_OAUTH_MAX_CLIENTS:-}
      CTX_OAUTH_REGISTER_RATE: ${CTX_OAUTH_REGISTER_RATE:-}
      CTX_TRUSTED_PROXY: ${CTX_TRUSTED_PROXY:-}
    networks:
      - n8nintern
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ctx", "-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          # UD-02-04 Stufe 2 (Board-Entscheid C3=1g, XML-Rückgabe 2026-08-05T23:14Z):
          # Headroom für engine=ctx-Erstlauf + centroid_build. Stufe 1 (512M) war
          # die Freigabe vom 05.08. gegen die 256M-OOM-Flanke (R7). S12-korrigierte
          # Staffel: >=3G K1 / >=8G K2 + Elternlast am 10M-Ziel (design/04 §6.3).
          memory: 1G
        reservations:
          memory: 32M
    logging:
      options:
        max-size: "50m"
        max-file: "3"

  db:
    build: ./db-image
    image: pgvector-timescaledb:pg18
    restart: unless-stopped
    # 0b-1 (E-15, 2026-08-27): parallel HNSW builds need DSM headroom; the
    # Docker default of 64 MB starves them (plan corpus F-27/M39).
    shm_size: 4gb
    networks:
      - n8nintern
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      CONTEXT_DB: ${CONTEXT_DB}
      CONTEXT_DB_USER: ${CONTEXT_DB_USER}
      CONTEXT_DB_PASSWORD: ${CONTEXT_DB_PASSWORD}
    volumes:
      - ./db:/var/lib/postgresql
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: llama.cpp CPU-only inference sidecar.
  # Useful for Dream embedding on CPU (frees GPU for query-path).
  # Mount your GGUF models into /models. Route Dream embedding here via a pool
  # row (`ctx backends`, role dream-embed, base_url http://llama-embed:8081,
  # protocol openai) — the pool is the only route (see the backend-topology
  # note in the ctx service above).
  #
  # llama-embed:
  #   image: ghcr.io/ggml-org/llama.cpp:server
  #   container_name: llama-embed
  #   restart: unless-stopped
  #   volumes:
  #     - /opt/models:/models:ro
  #   command: >
  #     --model /models/Qwen3-Embedding-8B-Q4_K_M.gguf
  #     --embedding
  #     --pooling last
  #     --port 8081
  #     --ctx-size 2048
  #     --n-gpu-layers 0
  #   networks:
  #     - n8nintern
  #   healthcheck:
  #     test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 15s

  # llama.cpp CPU-only cross-encoder reranker sidecar (Wave 2, opt-in since
  # v5.0.0 — see the CTX_RERANK_ENABLED block above). Starting the container
  # engages nothing on its own: ctx reaches a reranker only through a pool row
  # of role rerank pointing at http://ctx-rerank:8082 (`ctx backends`), with
  # CTX_RERANK_ENABLED=true. bge-reranker-v2-m3 (XLM-RoBERTa, multilingual
  # de+en) over the cohere-style /v1/rerank endpoint; all-local, $0. The
  # real oversized-input guard is ctx's app-side per-doc clamp
  # (rrf.RerankCrossEncoderContentLimit, ~2048 chars): a single query+doc
  # pair longer than the batch kills the server PROCESS (not a graceful
  # error), so ctx-size/batch must stay >= that clamp in tokens.
  ctx-rerank:
    image: ghcr.io/ggml-org/llama.cpp:server-b10331@sha256:5a7d34c5a378b6f3b542e71690bd82db7b5bf31fd77d9d1582cc7f2c9043ad8c
    container_name: ctx-rerank
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      - /opt/models:/models:ro
    # --reranking implies embedding pooling internally; --pooling rank is the
    # documented activation. KEY: llama.cpp splits --ctx-size across --parallel
    # slots, so per-slot context = 4096/4 = 1024 tokens — must exceed the
    # longest query+doc pair (~750 tokens for a 2048-char German doc; a
    # 2048/4=512 slot rejected pairs with HTTP 400 exceed_context_size).
    # --batch (compute buffer, NOT divided) stays at 2048 to bound memory; an
    # 8192 batch OOM-killed at 2g. --threads 12 = all host cores. CPU rerank
    # costs ~0.85s/doc — the query body-heartbeat keeps reverse proxies from
    # timing out on the ~80-90s path.
    command: >
      --model /models/bge-reranker-v2-m3-Q8_0.gguf
      --reranking
      --pooling rank
      --port 8082
      --ctx-size 4096
      --batch-size 2048
      --ubatch-size 2048
      --parallel 4
      --threads 12
      --n-gpu-layers 0
    networks:
      - n8nintern
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # llama.cpp CPU emergency fallback for the query path (synthesis only).
  # Engaged when a low-priority pool row targets it (e.g. name `llama-cpu`,
  # prio 10, role synthesis, base_url http://llama-cpu:8090 — `ctx backends`);
  # a fresh install has no such row until someone creates one. The chain walks
  # to it when the higher-priority row fails in a way that earns a failover —
  # transport (host down/Gaming-Mode), gateway 5xx, rate limit, auth, billing;
  # a slow-but-alive backend keeps the call (timeouts stop the walk unless
  # pool.failover_on_timeout says otherwise) and so does a plain 500. Because
  # the failover is a pool decision, priority — not an env var — is what makes
  # this the LAST resort. Same MTP-GGUF as production → identical
  # answer quality at CPU speed (~2.25 tok/s tg, 74 tok/s pp ⇒ a 500-token
  # synthesis takes 4.5-5.5 min; the response-body heartbeat keeps buffering
  # reverse proxies alive). ctx-size 32k suffices: the openai path never sends
  # num_ctx, query prompts are ≤10k tokens. --threads 10 leaves headroom for
  # PG + ctx on the 12-thread host. Idle cost ≈ 0 (mmap'd weights, no compute).
  llama-cpu:
    image: ghcr.io/ggml-org/llama.cpp:server-b10331@sha256:5a7d34c5a378b6f3b542e71690bd82db7b5bf31fd77d9d1582cc7f2c9043ad8c
    container_name: llama-cpu
    restart: unless-stopped
    volumes:
      - /opt/models:/models:ro
    command: >
      --model /models/Qwen3.6-27B-MTP-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8090
      --ctx-size 32768
      --n-gpu-layers 0
      --threads 10
      --jinja
      --reasoning off
      --top-k 20
      --top-p 0.95
      --min-p 0
      --presence-penalty 1.5
    networks:
      - n8nintern
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

networks:
  n8nintern:
    name: n8nintern
