# ctx by GottZ — The memory your LLM pretends to have.
# GottZ 4-Way RRF | GottZ Scope Model | GottZ Guard
# https://github.com/GottZ/ctx

services:
  ctx:
    build:
      context: ./go
      dockerfile: Dockerfile
    container_name: ctx
    restart: unless-stopped
    labels:
      - "reversed.host=${CTX_HOSTNAME}"
      - "reversed.port=8080"
      - "reversed.ssl=${CTX_SSL_DOMAIN}"
    environment:
      CONTEXT_DB: ${CONTEXT_DB}
      CONTEXT_DB_USER: ${CONTEXT_DB_USER}
      CONTEXT_DB_PASSWORD: ${CONTEXT_DB_PASSWORD}
      CONTEXT_DB_HOST: db
      CONTEXT_DB_PORT: 5432
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      OLLAMA_EMBED_DIMS: ${OLLAMA_EMBED_DIMS}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      LISTEN_ADDR: ":8080"
    networks:
      - n8nintern
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ctx", "-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 32M
    logging:
      options:
        max-size: "50m"
        max-file: "3"

  db:
    build: ./db-image
    image: pgvector-timescaledb:pg18
    restart: unless-stopped
    networks:
      - n8nintern
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      CONTEXT_DB: ${CONTEXT_DB}
      CONTEXT_DB_USER: ${CONTEXT_DB_USER}
      CONTEXT_DB_PASSWORD: ${CONTEXT_DB_PASSWORD}
    volumes:
      - ./db:/var/lib/postgresql
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  n8nintern:
    name: n8nintern
